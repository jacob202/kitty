[pytest]
# Default run excludes explicitly slow/external layers.
addopts = -m "not browser and not merge_gate and not integration and not controlled_live" --ignore=tests/test_overnight_retry.py --strict-markers
pythonpath = .
testpaths = tests
markers =
    browser: needs Playwright/Chromium; slow, optional
    merge_gate: runs the nested merge-gate script; explicit only
    integration: hermetic integration excluded from the default local run
    controlled_live: explicitly authorized external-provider contract smoke; never default
