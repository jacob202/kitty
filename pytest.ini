[pytest]
# Default local feedback is hermetic and excludes real process/git integration
# plus explicitly authorized external-provider probes. CI requires integration
# separately, so this is a latency split rather than a coverage reduction.
addopts = -m "not integration and not controlled_live" --strict-markers
pythonpath = .
testpaths = tests
markers =
    integration: hermetic real-process/git/lifecycle coverage; required separately in CI
    controlled_live: explicitly authorized external-provider contract smoke; never default
