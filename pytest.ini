[pytest]
# Default local feedback is hermetic and excludes real process/git integration
# plus explicitly authorized external-provider probes. CI requires integration
# separately, so this is a latency split rather than a coverage reduction.
#
# The gate is the slowest step ahead of a push and this host has cores to spare,
# so modules are spread across workers. `--dist loadfile` keeps a module whole on
# one worker in collection order: 2026-08-23's delivery-pipeline baseline
# (docs/audit/delivery-pipeline-baseline-2026-08-23.md) declined parallelism
# because SQLite-backed tests that depend on runtime isolation manufacture
# flakes when they run out of order. Per-module workers preserve that ordering
# between tests, and tests/conftest.py gives each test its own stores rather
# than relying on a neighbour's leftovers.
addopts = -n auto --dist loadfile -m "not integration and not controlled_live" --strict-markers
pythonpath = .
testpaths = tests
markers =
    integration: hermetic real-process/git/lifecycle coverage; required separately in CI
    controlled_live: explicitly authorized external-provider contract smoke; never default
