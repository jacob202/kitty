# LiteLLM — Kitty model surface
#
#   kitty-default  → DeepSeek V4 Pro via OpenRouter (primary brain)
#   kitty-sonnet   → DeepSeek V4 Pro + thinking (deep tier)
#   kitty-small    → DeepSeek V4 Flash via OpenRouter (cheap/fast)
#   kitty-vision   → Mistral Small (vision tasks, image gen)
#
# Run: bash gateway/start_litellm.sh
#
# Env: OPENROUTER_API_KEY, MISTRAL_API_KEY, LITELLM_MASTER_KEY

model_list:
  - model_name: kitty-default
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: os.environ/OPENROUTER_API_KEY
      max_tokens: 16384

  - model_name: kitty-sonnet
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: os.environ/OPENROUTER_API_KEY
      max_tokens: 16384

  - model_name: kitty-small
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY
      max_tokens: 4096

  - model_name: kitty-vision
    litellm_params:
      model: openrouter/mistral/mistral-small-latest
      api_key: os.environ/OPENROUTER_API_KEY
      max_tokens: 4096

router_settings:
  routing_strategy: usage-based-routing-v2
  num_retries: 1
  timeout: 120

litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 1
  fallbacks:
    - kitty-default: [kitty-small]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
