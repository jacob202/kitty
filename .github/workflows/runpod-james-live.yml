name: RunPod James Live Batch

# Live trigger: 2026-07-31T07:34Z — twelve attempts
on:
  push:
    branches: [feat/runpod-image-studio-smoke]
    paths:
      - .github/workflows/runpod-james-live.yml
  workflow_dispatch:
    inputs:
      attempts:
        description: Number of James portrait attempts
        required: true
        default: "12"

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: runpod-james-live
  cancel-in-progress: false

jobs:
  james-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    env:
      GH_TOKEN: ${{ github.token }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_TEMPLATE_ID: 2lv7ev3wfp
      KITTY_BOOTSTRAP_REF: ${{ github.sha }}
      RUNPOD_MAX_HOURLY_RATE: "0.60"
      RUNPOD_HARD_RUNTIME_MINUTES: "70"
      RUNPOD_READY_TIMEOUT_SECONDS: "1200"
      RUNPOD_GENERATION_TIMEOUT_SECONDS: "600"
      RUNPOD_POLL_INTERVAL_SECONDS: "5"
      COMFY_CHECKPOINT: RealVisXL_V4.0.safetensors
      COMFY_CHECKPOINT_URL: https://huggingface.co/SG161222/RealVisXL_V4.0/resolve/main/RealVisXL_V4.0.safetensors?download=true
      COMFY_CHECKPOINT_SHA256: 912c9dc74f5855175c31a7993f863a043ac8dcc31732b324cd05d75cd7e16844

    steps:
      - name: Checkout live batch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Announce live run
        run: |
          gh pr comment 306 --repo "$GITHUB_REPOSITORY" --body \
            "RunPod James 12-attempt batch started: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Kitty and worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r workers/comfy_worker/requirements.txt

      - name: Prepare ephemeral worker token
        shell: bash
        run: echo "KITTY_WORKER_BEARER_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Confirm RunPod credential is present
        shell: bash
        run: |
          test -n "$RUNPOD_API_KEY" || { echo "RUNPOD_API_KEY secret is missing" >&2; exit 2; }

      - name: Generate James portrait batches
        shell: bash
        run: |
          TOTAL="${{ github.event.inputs.attempts || '12' }}"
          REMAINING="$TOTAL"
          BATCH=1
          while [ "$REMAINING" -gt 0 ]; do
            COUNT="$REMAINING"
            if [ "$COUNT" -gt 6 ]; then COUNT=6; fi
            python scripts/runpod_james_batch.py \
              --attempts "$COUNT" \
              --output-dir "runtime-data/runpod-james/batch-$BATCH" \
              --accept-charges
            REMAINING=$((REMAINING - COUNT))
            BATCH=$((BATCH + 1))
          done

      - name: Upload generated images and provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runpod-james-${{ github.run_id }}
          path: runtime-data/runpod-james/
          if-no-files-found: warn
          retention-days: 14

      - name: Report success
        if: success()
        run: |
          gh pr comment 306 --repo "$GITHUB_REPOSITORY" --body \
            "RunPod James 12-attempt batch succeeded. Images and provenance are attached to run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Report failure
        if: failure()
        run: |
          gh pr comment 306 --repo "$GITHUB_REPOSITORY" --body \
            "RunPod James 12-attempt batch failed. Inspect the exact step here: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
