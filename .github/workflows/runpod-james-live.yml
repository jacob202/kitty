name: RunPod Template Startup Audit

on:
  push:
    branches: [feat/runpod-image-studio-smoke]
    paths:
      - .github/workflows/runpod-james-live.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  template-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_TEMPLATE_ID: 2lv7ev3wfp

    steps:
      - name: Announce audit run
        run: |
          gh pr comment 306 --repo "$GITHUB_REPOSITORY" --body \
            "RunPod startup-field audit: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install audit dependency
        run: pip install httpx==0.28.1

      - name: Audit source and temporary template startup fields
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import secrets
          import httpx

          base = "https://rest.runpod.io/v1"
          key = os.environ["RUNPOD_API_KEY"]
          source_id = os.environ["RUNPOD_TEMPLATE_ID"]
          headers = {"Authorization": f"Bearer {key}", "Content-Type": "application/json"}
          include = {"includePublicTemplates": True, "includeRunpodTemplates": True}

          def safe(value):
              return {
                  "id": value.get("id"),
                  "imageName": value.get("imageName"),
                  "dockerEntrypoint": value.get("dockerEntrypoint"),
                  "dockerStartCmd": value.get("dockerStartCmd"),
                  "ports": value.get("ports"),
                  "isRunpod": value.get("isRunpod"),
                  "isServerless": value.get("isServerless"),
                  "volumeMountPath": value.get("volumeMountPath"),
              }

          with httpx.Client(timeout=45) as client:
              response = client.get(
                  f"{base}/templates/{source_id}", headers=headers, params=include
              )
              response.raise_for_status()
              source = response.json()
              print("SOURCE_TEMPLATE=" + json.dumps(safe(source), sort_keys=True))

              command = "printf 'kitty-start-command-ran\\n'; sleep 300"
              payload = {
                  "imageName": source["imageName"],
                  "name": f"kitty-startup-audit-{secrets.token_hex(3)}",
                  "category": "NVIDIA",
                  "containerDiskInGb": max(40, int(source.get("containerDiskInGb") or 0)),
                  "dockerEntrypoint": ["bash", "-lc"],
                  "dockerStartCmd": [command],
                  "env": {},
                  "isPublic": False,
                  "isServerless": False,
                  "ports": ["8000/http"],
                  "readme": "Temporary startup-field audit; no Pod deployment.",
                  "volumeInGb": 20,
                  "volumeMountPath": "/workspace",
              }
              created = client.post(f"{base}/templates", headers=headers, json=payload)
              created.raise_for_status()
              temp = created.json()
              temp_id = temp["id"]
              try:
                  fetched = client.get(f"{base}/templates/{temp_id}", headers=headers)
                  fetched.raise_for_status()
                  print("TEMP_TEMPLATE=" + json.dumps(safe(fetched.json()), sort_keys=True))
              finally:
                  deleted = client.delete(f"{base}/templates/{temp_id}", headers=headers)
                  deleted.raise_for_status()
                  print("TEMP_TEMPLATE_DELETED=" + temp_id)
          PY
