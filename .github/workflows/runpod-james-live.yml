name: RunPod James Single Smoke

on:
  push:
    branches: [feat/runpod-image-studio-smoke]
    paths:
      - .github/workflows/runpod-james-live.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: runpod-james-live
  cancel-in-progress: false

jobs:
  james-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_TEMPLATE_ID: 2lv7ev3wfp
      KITTY_BOOTSTRAP_REF: ${{ github.sha }}
      RUNPOD_MAX_HOURLY_RATE: "0.60"
      RUNPOD_HARD_RUNTIME_MINUTES: "55"
      RUNPOD_READY_TIMEOUT_SECONDS: "2400"
      RUNPOD_GENERATION_TIMEOUT_SECONDS: "600"
      RUNPOD_POLL_INTERVAL_SECONDS: "5"
      RUNPOD_CLOUD_TYPES: COMMUNITY,SECURE
      RUNPOD_CAPACITY_RETRY_ROUNDS: "8"
      RUNPOD_CAPACITY_RETRY_SECONDS: "30"
      COMFY_CHECKPOINT: RealVisXL_V4.0.safetensors
      COMFY_CHECKPOINT_URL: https://huggingface.co/SG161222/RealVisXL_V4.0/resolve/main/RealVisXL_V4.0.safetensors?download=true
      COMFY_CHECKPOINT_SHA256: 912c9dc74f5855175c31a7993f863a043ac8dcc31732b324cd05d75cd7e16844

    steps:
      - name: Checkout smoke-test commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Announce live smoke
        run: |
          gh pr comment 306 --repo "$GITHUB_REPOSITORY" --body \
            "RunPod one-image explicit-startup smoke: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install live-run dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx==0.28.1 pillow==11.3.0

      - name: Prepare ephemeral worker token
        shell: bash
        run: echo "KITTY_WORKER_BEARER_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Confirm RunPod credential is present
        shell: bash
        run: |
          test -n "$RUNPOD_API_KEY" || { echo "RUNPOD_API_KEY secret is missing" >&2; exit 2; }

      - name: Generate one real smoke image
        shell: bash
        run: |
          python scripts/runpod_james_adaptive.py \
            --attempts 1 \
            --output-dir runtime-data/runpod-james \
            --accept-charges

      - name: Upload generated image and provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runpod-james-${{ github.run_id }}
          path: runtime-data/runpod-james/
          if-no-files-found: warn
          retention-days: 14

      - name: Report success
        if: success()
        run: |
          gh pr comment 306 --repo "$GITHUB_REPOSITORY" --body \
            "RunPod one-image explicit-startup smoke succeeded. Genuine image and provenance: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Report failure
        if: failure()
        run: |
          gh pr comment 306 --repo "$GITHUB_REPOSITORY" --body \
            "RunPod one-image explicit-startup smoke failed. Exact logs and failure manifest: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
