name: Tests

on:
  pull_request:
  push:
    branches: [ main ]

# Six jobs per run, including a full pytest suite and a Playwright browser
# smoke. Without this, every push to a PR branch left the superseded run
# burning metered minutes to completion on a result nobody would read.
# Pushes to main are never cancelled: main's history needs a verdict per commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # The continuity check defaults to ~/Projects/kitty; on CI runners the
      # checkout lives under $GITHUB_WORKSPACE. This override keeps the check
      # honest without hardcoding runner paths in the source.
      KITTY_EXPECTED_CANONICAL_CHECKOUT: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Builder's immutable packet base must resolve from origin/main.
          fetch-depth: 0
          # Attach HEAD to the actual branch (not the merge preview or a bare
          # SHA), so continuity checks read a proper git:branch and matched
          # recorded HEAD instead of a detached-HEAD false positive.
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run test suite
        run: |
          # TH-03 ratchet: floor = measured 76% (2026-07-19, pristine
          # worktree at origin/main) minus 3. Council --ignore flags removed:
          # both files were deleted in d260309 (2026-06-18).
          set -o pipefail
          python -m pytest tests/ -q --tb=short \
            --cov=gateway --cov-report=term-missing --cov-fail-under=73 \
            2>&1 | tee pytest-output.txt

      - name: Upload pytest output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-output
          path: pytest-output.txt
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check gateway/ tests/ mcp/ workers/ scripts/runpod_worker_smoke_test.py

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # The checked paths' dependencies must be installed. Without them
      # `ignore_missing_imports` turns every third-party import into `Any` and
      # mypy silently checks nothing about it — that is how seven real errors in
      # mcp/imagen/ reached main unseen while the pre-push hook, which runs where
      # the libraries exist, blocked every push on them.
      #
      # workers/comfy_worker/requirements.txt is deliberately excluded: it is a
      # separately deployed service pinning fastapi 0.140.0 / pydantic 2.12.5
      # against the gateway's 0.141.1 / 2.13.4, so adding it makes pip
      # unresolvable. Its imports are the same packages, and type checking needs
      # them present, not pinned to that service's versions.
      - name: Mypy
        run: |
          python -m pip install --upgrade pip
          pip install mypy types-requests types-PyYAML types-python-dateutil
          pip install -r requirements.txt \
            -r mcp/builder/requirements.txt \
            -r mcp/imagen/requirements.txt
          mypy gateway/ mcp/ workers/ scripts/runpod_worker_smoke_test.py

  kitty-chat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway/kitty-chat
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/kitty-chat/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: ./node_modules/.bin/vitest run
      - name: npm audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Build
        run: node node_modules/next/dist/bin/next build

  browser-smoke:
    runs-on: ubuntu-latest
    needs: kitty-chat
    defaults:
      run:
        working-directory: gateway/kitty-chat
    env:
      KITTY_GATEWAY_SECRET: smoke-test-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/kitty-chat/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        run: node node_modules/next/dist/bin/next build --webpack
      - name: Start gateway stub for health gate
        run: |
          python3 - <<'PY' &
          import http.server

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path.startswith("/health"):
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(b'{"status":"ok"}')
                  else:
                      self.send_response(503)
                      self.end_headers()

              def log_message(self, *args):
                  pass

          http.server.HTTPServer(("127.0.0.1", 8000), Handler).serve_forever()
          PY
          sleep 1
      - name: Start server
        run: node node_modules/next/dist/bin/next start -p 4000 &
      - name: Wait for server
        run: npx wait-on http://localhost:4000 --timeout 30000
      - name: Run smoke tests
        env:
          PLAYWRIGHT_PORT: "4000"
          PLAYWRIGHT_REUSE_EXISTING_SERVER: "1"
        run: npx playwright test
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: gateway/kitty-chat/playwright-report/
          retention-days: 7

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Dead code (vulture)
        run: |
          python -m pip install --upgrade pip
          pip install vulture
          vulture gateway/ --min-confidence 80 \
            --exclude gateway/kitty-chat/

      - name: Broken links (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --root-dir docs --no-progress --accept 200,301,302,307,308 docs/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency analysis (deptry, advisory)
        continue-on-error: true
        run: |
          pip install deptry
          deptry .
        # Advisory: 65 findings as of 2026-07-15, mostly optional deps not
        # declared in requirements.txt (docx, fitz, pypdf) and transitive
        # imports (starlette, google). Configure deptry.toml before gating.

      - name: pip-audit (advisory)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit

      - name: Bandit (advisory)
        continue-on-error: true
        run: |
          pip install bandit
          bandit -c pyproject.toml -r gateway/ || bandit -r gateway/ --skip B101,B311
