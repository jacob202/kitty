name: Apply RunPod Startup Fix

on:
  push:
    branches: [feat/runpod-image-studio-smoke]
    paths:
      - .github/workflows/runpod-apply-startup-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.head_commit.message == 'ci(image): apply RunPod startup fix'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runpod-image-studio-smoke
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Apply explicit REST startup fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          control = 'gateway/runpod_control.py'
          replace_once(
              control,
              '''        env: Mapping[str, str] | None = None,\n        name_suffix: str | None = None,\n    ) -> PodInfo:\n''',
              '''        env: Mapping[str, str] | None = None,\n        name_suffix: str | None = None,\n        image_name: str | None = None,\n        docker_entrypoint: Sequence[str] | None = None,\n        docker_start_cmd: Sequence[str] | None = None,\n    ) -> PodInfo:\n''',
          )
          replace_once(
              control,
              '''        suffix = name_suffix or now.strftime("%Y%m%d-%H%M%S")\n        pod_name = f"{KITTY_POD_PREFIX}{suffix}"\n        common_input: dict[str, object] = {\n''',
              '''        suffix = name_suffix or now.strftime("%Y%m%d-%H%M%S")\n        pod_name = f"{KITTY_POD_PREFIX}{suffix}"\n\n        if image_name is not None:\n            normalized_image_name = image_name.strip()\n            normalized_entrypoint = [\n                str(item) for item in (docker_entrypoint or ()) if str(item)\n            ]\n            normalized_start_cmd = [\n                str(item) for item in (docker_start_cmd or ()) if str(item)\n            ]\n            if not normalized_image_name:\n                raise RunPodConfigurationError("image_name must not be empty")\n            if not normalized_entrypoint or not normalized_start_cmd:\n                raise RunPodConfigurationError(\n                    "explicit REST deployment requires docker_entrypoint and docker_start_cmd"\n                )\n            return await self._create_image_pod_rest(\n                template_id=template_id,\n                image_name=normalized_image_name,\n                docker_entrypoint=normalized_entrypoint,\n                docker_start_cmd=normalized_start_cmd,\n                gpu_type_ids=normalized_gpu_ids,\n                max_hourly_rate=max_hourly_rate,\n                ports=ports,\n                network_volume_id=network_volume_id,\n                cloud_type=cloud_type,\n                container_disk_gb=container_disk_gb,\n                volume_gb=volume_gb,\n                pod_env=pod_env,\n                pod_name=pod_name,\n            )\n        if docker_entrypoint is not None or docker_start_cmd is not None:\n            raise RunPodConfigurationError(\n                "docker startup overrides require image_name and REST deployment"\n            )\n\n        common_input: dict[str, object] = {\n''',
          )
          replace_once(
              control,
              '''    async def _validate_created_pod_rate(\n''',
              '''    async def _create_image_pod_rest(\n        self,\n        *,\n        template_id: str,\n        image_name: str,\n        docker_entrypoint: Sequence[str],\n        docker_start_cmd: Sequence[str],\n        gpu_type_ids: Sequence[str],\n        max_hourly_rate: float,\n        ports: Sequence[str],\n        network_volume_id: str | None,\n        cloud_type: str,\n        container_disk_gb: int,\n        volume_gb: int,\n        pod_env: Mapping[str, str],\n        pod_name: str,\n    ) -> PodInfo:\n        pod_input: dict[str, object] = {\n            "name": pod_name,\n            "cloudType": cloud_type,\n            "computeType": "GPU",\n            "containerDiskInGb": container_disk_gb,\n            "dockerEntrypoint": list(docker_entrypoint),\n            "dockerStartCmd": list(docker_start_cmd),\n            "env": dict(sorted(pod_env.items())),\n            "gpuCount": 1,\n            "gpuTypeIds": list(gpu_type_ids),\n            "gpuTypePriority": "custom",\n            "imageName": image_name,\n            "interruptible": False,\n            "locked": False,\n            "ports": list(ports),\n            "supportPublicIp": False,\n            "templateId": template_id,\n            "volumeMountPath": "/workspace",\n        }\n        if network_volume_id:\n            pod_input["networkVolumeId"] = network_volume_id\n        else:\n            pod_input["volumeInGb"] = volume_gb\n\n        try:\n            payload = await self._request("POST", "/pods", json_body=pod_input)\n        except RunPodTransportError as exc:\n            raise RunPodAmbiguousCreateError(pod_name, exc) from exc\n        except RunPodApiError as exc:\n            message = str(exc)\n            lowered = message.lower()\n            capacity_markers = (\n                "no capacity",\n                "no available",\n                "not available",\n                "availability",\n                "unable to rent",\n                "could not find",\n            )\n            if any(marker in lowered for marker in capacity_markers):\n                raise RunPodApiError(\n                    "RunPod rejected every requested GPU candidate: " + message\n                ) from exc\n            raise\n\n        if not isinstance(payload, Mapping):\n            raise RunPodAmbiguousCreateError(\n                pod_name, RunPodApiError("REST create result was not an object")\n            )\n        normalized_payload = dict(payload)\n        normalized_payload.setdefault("name", pod_name)\n        normalized_payload.setdefault("env", dict(pod_env))\n        pod = PodInfo.from_payload(normalized_payload)\n        if not pod.pod_id:\n            raise RunPodAmbiguousCreateError(\n                pod_name, RunPodApiError("REST create result did not include a Pod id")\n            )\n\n        observed_entrypoint = normalized_payload.get("dockerEntrypoint")\n        observed_start_cmd = normalized_payload.get("dockerStartCmd")\n        if (\n            observed_entrypoint != list(docker_entrypoint)\n            or observed_start_cmd != list(docker_start_cmd)\n        ):\n            cleanup_error = await self._delete_after_invalid_create(pod.pod_id)\n            detail = (\n                f"; cleanup failed: {cleanup_error}"\n                if cleanup_error is not None\n                else "; Pod was terminated"\n            )\n            raise RunPodApiError(\n                "RunPod REST create did not preserve explicit Docker startup overrides"\n                + detail\n            )\n\n        await self._validate_created_pod_rate(pod, max_hourly_rate)\n        return pod\n\n    async def _validate_created_pod_rate(\n''',
          )

          batch = 'scripts/runpod_james_batch.py'
          replace_once(
              batch,
              '''async def _create_temporary_template(\n    client: httpx.AsyncClient,\n    *,\n    api_key: str,\n    source_template_id: str,\n    bootstrap_ref: str,\n    run_id: str,\n) -> str:\n''',
              '''async def _create_temporary_template(\n    client: httpx.AsyncClient,\n    *,\n    api_key: str,\n    source_template_id: str,\n    bootstrap_ref: str,\n    run_id: str,\n) -> tuple[str, str, tuple[str, ...], tuple[str, ...]]:\n''',
          )
          replace_once(
              batch,
              '''    if not isinstance(payload, Mapping) or not payload.get("id"):\n        raise RuntimeError("RunPod temporary template response did not include id")\n    return str(payload["id"])\n''',
              '''    if not isinstance(payload, Mapping) or not payload.get("id"):\n        raise RuntimeError("RunPod temporary template response did not include id")\n    return (\n        str(payload["id"]),\n        image_name,\n        ("bash", "-lc"),\n        (command,),\n    )\n''',
          )
          replace_once(
              batch,
              '''    temp_template_id: str | None = None\n    pod: PodInfo | None = None\n''',
              '''    temp_template_id: str | None = None\n    temp_image_name: str | None = None\n    temp_docker_entrypoint: tuple[str, ...] = ()\n    temp_docker_start_cmd: tuple[str, ...] = ()\n    pod: PodInfo | None = None\n''',
          )
          replace_once(
              batch,
              '''    cleanup_errors: list[str] = []\n\n    async with httpx.AsyncClient() as http_client:\n''',
              '''    cleanup_errors: list[str] = []\n    failure: Exception | None = None\n\n    async with httpx.AsyncClient() as http_client:\n''',
          )
          replace_once(
              batch,
              '''            temp_template_id = await _create_temporary_template(\n''',
              '''            (\n                temp_template_id,\n                temp_image_name,\n                temp_docker_entrypoint,\n                temp_docker_start_cmd,\n            ) = await _create_temporary_template(\n''',
          )
          replace_once(
              batch,
              '''                    name_suffix=f"james-{run_id}",\n                )\n''',
              '''                    name_suffix=f"james-{run_id}",\n                    image_name=temp_image_name,\n                    docker_entrypoint=temp_docker_entrypoint,\n                    docker_start_cmd=temp_docker_start_cmd,\n                )\n''',
          )
          replace_once(
              batch,
              '''                    records.append({"worker_health": health})\n        finally:\n''',
              '''                    records.append({"worker_health": health})\n        except Exception as exc:\n            failure = exc\n        finally:\n''',
          )
          replace_once(
              batch,
              '''        "cleanup_errors": cleanup_errors,\n    }\n''',
              '''        "failure": str(failure) if failure is not None else None,\n        "cleanup_errors": cleanup_errors,\n    }\n''',
          )
          replace_once(
              batch,
              '''    manifest_path.write_text(json.dumps(manifest, indent=2), encoding="utf-8")\n    if cleanup_errors:\n''',
              '''    manifest_path.write_text(json.dumps(manifest, indent=2), encoding="utf-8")\n    if failure is not None:\n        detail = str(failure)\n        if cleanup_errors:\n            detail += "; cleanup incomplete: " + "; ".join(cleanup_errors)\n        raise RuntimeError(detail) from failure\n    if cleanup_errors:\n''',
          )

          tests = Path('tests/test_runpod_control.py')
          test_text = tests.read_text(encoding='utf-8')
          marker = '''@pytest.mark.asyncio\nasync def test_actual_cost_sums_matching_billing_records():\n'''
          if test_text.count(marker) != 1:
              raise SystemExit('test insertion marker missing or duplicated')
          new_test = '''@pytest.mark.asyncio\nasync def test_create_image_pod_rest_preserves_explicit_startup_overrides():\n    captured: dict[str, object] = {}\n\n    def handler(request: httpx.Request) -> httpx.Response:\n        assert request.url.path == "/v1/pods"\n        assert request.method == "POST"\n        body = json.loads(request.content)\n        captured.update(body)\n        return httpx.Response(\n            201,\n            json={\n                "id": "rest-pod",\n                "name": f"{KITTY_POD_PREFIX}rest",\n                "desiredStatus": "RUNNING",\n                "adjustedCostPerHr": 0.31,\n                "dockerEntrypoint": ["bash", "-lc"],\n                "dockerStartCmd": ["exec /tmp/bootstrap.sh"],\n                "gpu": {"displayName": "NVIDIA L4"},\n            },\n        )\n\n    async with httpx.AsyncClient(transport=httpx.MockTransport(handler)) as http_client:\n        async with _client(http_client) as client:\n            pod = await client.create_image_pod(\n                template_id="template-1",\n                image_name="runpod/comfyui:cuda13.0",\n                docker_entrypoint=("bash", "-lc"),\n                docker_start_cmd=("exec /tmp/bootstrap.sh",),\n                gpu_type_ids=("NVIDIA L4", "NVIDIA RTX A5000"),\n                max_hourly_rate=0.60,\n                hard_runtime_minutes=55,\n                ports=("8000/http",),\n                name_suffix="rest",\n            )\n\n    assert pod.pod_id == "rest-pod"\n    assert captured["imageName"] == "runpod/comfyui:cuda13.0"\n    assert captured["templateId"] == "template-1"\n    assert captured["dockerEntrypoint"] == ["bash", "-lc"]\n    assert captured["dockerStartCmd"] == ["exec /tmp/bootstrap.sh"]\n    assert captured["gpuTypeIds"] == ["NVIDIA L4", "NVIDIA RTX A5000"]\n    assert captured["gpuTypePriority"] == "custom"\n    assert captured["supportPublicIp"] is False\n\n\n'''
          tests.write_text(test_text.replace(marker, new_test + marker, 1), encoding='utf-8')
          PY

      - name: Run focused tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.4.1 pytest-asyncio==1.1.0 httpx==0.28.1
          python -m pytest tests/test_runpod_control.py -q

      - name: Commit verified fix
        shell: bash
        run: |
          rm .github/workflows/runpod-apply-startup-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gateway/runpod_control.py scripts/runpod_james_batch.py tests/test_runpod_control.py .github/workflows/runpod-apply-startup-fix.yml
          git commit -m "fix(image): deploy worker with explicit REST startup overrides"
          git push origin HEAD:feat/runpod-image-studio-smoke
