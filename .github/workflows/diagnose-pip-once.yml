name: Diagnose pip install once

on:
  push:
    branches:
      - fix/restore-ci-installs

permissions:
  contents: write

jobs:
  diagnose-pip:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-ci-installs
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Capture resolver output
        run: |
          set +e
          python -m pip install --dry-run -r requirements.txt > /tmp/pip-install.log 2>&1
          status=$?
          {
            echo "exit_status=$status"
            echo
            tail -n 240 /tmp/pip-install.log
          } > .ci-pip-install-diagnostic.txt
          exit 0

      - name: Commit diagnostic and remove bootstrap workflow
        run: |
          rm .github/workflows/diagnose-pip-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-pip-install-diagnostic.txt .github/workflows/diagnose-pip-once.yml
          git commit -m "chore(ci): capture pip resolver diagnostic"
          git push origin HEAD:fix/restore-ci-installs
