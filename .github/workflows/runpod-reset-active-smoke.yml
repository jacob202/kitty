name: Reset Active RunPod Smoke

on:
  push:
    branches: [feat/runpod-image-studio-smoke]
    paths:
      - .github/runpod-reset-active-smoke.trigger

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Announce reset
        run: |
          gh pr comment 306 --repo "$GITHUB_REPOSITORY" --body \
            "RunPod explicit reset diagnostic: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install httpx==0.28.1

      - name: Reset newest active Kitty smoke Pod
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import httpx

          headers = {
              "Authorization": f"Bearer {os.environ['RUNPOD_API_KEY']}",
              "Content-Type": "application/json",
          }
          with httpx.Client(timeout=45, follow_redirects=True) as client:
              listed = client.get("https://rest.runpod.io/v1/pods", headers=headers)
              listed.raise_for_status()
              pods = [
                  pod for pod in listed.json()
                  if str(pod.get("name") or "").startswith("kitty-image-james-")
                  and pod.get("desiredStatus") == "RUNNING"
              ]
              if not pods:
                  raise SystemExit("no active Kitty smoke Pod found")
              pod = max(pods, key=lambda value: str(value.get("lastStartedAt") or ""))
              pod_id = str(pod["id"])
              print("RESETTING_POD=" + pod_id)
              reset = client.post(
                  f"https://rest.runpod.io/v1/pods/{pod_id}/reset", headers=headers
              )
              print(f"RESET_STATUS={reset.status_code} BODY={reset.text[:500]}")
              reset.raise_for_status()
              time.sleep(20)
              current = client.get(
                  f"https://rest.runpod.io/v1/pods/{pod_id}", headers=headers
              )
              current.raise_for_status()
              value = current.json()
              print("POD_AFTER_RESET=" + json.dumps({
                  "desiredStatus": value.get("desiredStatus"),
                  "dockerEntrypoint": value.get("dockerEntrypoint"),
                  "dockerStartCmd": value.get("dockerStartCmd"),
                  "lastStatusChange": value.get("lastStatusChange"),
              }, sort_keys=True))
              health = client.get(f"https://{pod_id}-8000.proxy.runpod.net/health")
              print(
                  f"HEALTH_AFTER_RESET status={health.status_code} "
                  f"server={health.headers.get('server')} body={health.text[:500]}"
              )
          PY
