name: Finalize dogfood recovery v3

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'fix/dogfood-provider-chat-shell-2026-07-28'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dogfood-provider-chat-shell-2026-07-28
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gateway/kitty-chat/package-lock.json
      - name: Apply repair
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/dogfood-repair-apply.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          extracted = [line[10:] if line.startswith('          ') else line.lstrip() for line in lines[start:end]]
          path = Path('/tmp/apply_dogfood_repair.py')
          path.write_text('\n'.join(extracted) + '\n')
          compile(path.read_text(), str(path), 'exec')
          PY
          python /tmp/apply_dogfood_repair.py
          cat > tests/test_active_provider_routing.py <<'PYTEST'
          from __future__ import annotations

          import json

          import pytest

          from gateway import llm_client, provider_prefs


          @pytest.fixture(autouse=True)
          def isolated_preferences(tmp_path, monkeypatch):
              monkeypatch.setattr(provider_prefs, "PROVIDER_PREFS_FILE", tmp_path / "providers.json")


          def select_agentrouter(monkeypatch):
              monkeypatch.setenv("AGENTROUTER_API_KEY", "test-key")
              provider_prefs.save_preferences(
                  ["agentrouter"], [], known=tuple(llm_client.PROVIDERS), active="agentrouter"
              )


          def test_selected_provider_skips_litellm(monkeypatch):
              select_agentrouter(monkeypatch)
              calls = []

              def fake_provider(provider, messages, *args, **kwargs):
                  calls.append(provider.name)
                  return "agent router answered"

              monkeypatch.setattr(llm_client, "_call_provider", fake_provider)
              monkeypatch.setattr(
                  llm_client,
                  "_post",
                  lambda *args, **kwargs: (_ for _ in ()).throw(AssertionError("LiteLLM must be skipped")),
              )
              assert llm_client.call_llm([{"role": "user", "content": "hello"}]) == "agent router answered"
              assert calls == ["agentrouter"]


          @pytest.mark.asyncio
          async def test_selected_provider_works_through_streaming_ui_path(monkeypatch):
              select_agentrouter(monkeypatch)
              monkeypatch.setattr(llm_client, "_call_provider", lambda *args, **kwargs: "streamed direct")
              chunks = [
                  chunk
                  async for chunk in llm_client.iter_chat_completions_stream(
                      {"model": "kitty-default", "messages": [{"role": "user", "content": "hello"}]}
                  )
              ]
              assert chunks[-1] == b"data: [DONE]" + bytes([10, 10])
              payload = json.loads(chunks[0].decode().removeprefix("data: ").strip())
              assert payload["model"] == "agentrouter"
              assert payload["choices"][0]["delta"]["content"] == "streamed direct"


          def test_active_provider_cannot_be_unknown_or_disabled():
              known = tuple(llm_client.PROVIDERS)
              with pytest.raises(ValueError, match="unknown active provider"):
                  provider_prefs.save_preferences([], [], known=known, active="typo")
              with pytest.raises(ValueError, match="cannot also be disabled"):
                  provider_prefs.save_preferences([], ["agentrouter"], known=known, active="agentrouter")
          PYTEST
          python - <<'PY'
          from pathlib import Path

          llm = Path('gateway/llm_client.py')
          text = llm.read_text()
          text = text.replace(
              '        chunk = {\n            "id": "chatcmpl-kitty-selected-provider",',
              '        direct_chunk = {\n            "id": "chatcmpl-kitty-selected-provider",',
              1,
          )
          text = text.replace('json.dumps(chunk).encode("utf-8")', 'json.dumps(direct_chunk).encode("utf-8")', 1)
          llm.write_text(text)

          test = Path('gateway/kitty-chat/tests/ProviderCenter.test.tsx')
          text = test.read_text()
          text = text.replace(
              "      order: ['local', 'openrouter'],",
              "      active: 'auto',\n      order: ['local', 'openrouter'],",
              1,
          )
          text = text.replace(
              "    expect(screen.getByText('local')).toBeInTheDocument();\n    expect(screen.getByText('openrouter')).toBeInTheDocument();",
              "    expect(screen.getAllByText('local').length).toBeGreaterThan(0);\n    expect(screen.getAllByText('openrouter').length).toBeGreaterThan(0);",
          )
          text = text.replace(
              "{ order: ['openrouter', 'local'], disabled: [] }",
              "{ order: ['openrouter', 'local'], disabled: [], active: 'auto' }",
          )
          text = text.replace(
              "{ order: ['local', 'openrouter'], disabled: ['openrouter'] }",
              "{ order: ['local', 'openrouter'], disabled: ['openrouter'], active: 'auto' }",
          )
          text = text.replace(
              "{ order: ['local'], disabled: [] }",
              "{ order: ['local'], disabled: [], active: 'auto' }",
          )
          test.write_text(text)
          PY
      - name: Validate Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio
          ruff check gateway/ tests/ mcp/
          pytest -q tests/test_provider_prefs.py tests/test_active_provider_routing.py tests/test_llm_client.py tests/test_chat_completions.py
      - name: Validate frontend
        working-directory: gateway/kitty-chat
        run: |
          npm ci
          npm test -- --run
          npm run build
      - name: Commit final patch
        run: |
          rm -f .github/workflows/dogfood-repair-apply.yml
          rm -f .github/workflows/dogfood-repair-run.yml
          rm -f .github/workflows/finalize-dogfood-recovery.yml
          rm -f .github/workflows/finalize-dogfood-recovery-v2.yml
          rm -f .github/workflows/finalize-dogfood-recovery-v3.yml
          rm -f .github/workflows/diagnose-dogfood-frontend.yml
          git config user.name 'Kitty repair worker'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make provider choice real and consolidate work [dogfood-repair]'
          git push origin HEAD:fix/dogfood-provider-chat-shell-2026-07-28
