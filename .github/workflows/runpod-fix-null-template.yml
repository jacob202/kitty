name: Fix RunPod Direct Template Argument

on:
  push:
    branches: [feat/runpod-image-studio-smoke]
    paths:
      - .github/runpod-fix-null-template.trigger

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Announce fix run
        run: |
          gh pr comment 306 --repo "$GITHUB_REPOSITORY" --body \
            "Fixing direct-image null template argument: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: actions/checkout@v4
        with:
          ref: feat/runpod-image-studio-smoke
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply exact fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/runpod_james_batch.py")
          text = path.read_text(encoding="utf-8")
          old = "                    template_id=temp_template_id,\n"
          new = "                    template_id=source_template_id,\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected one null template argument, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify focused code
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.4.1 pytest-asyncio==1.1.0 httpx==0.28.1 pillow==11.3.0
          python -m py_compile scripts/runpod_james_batch.py gateway/runpod_control.py
          python -m pytest tests/test_runpod_control.py -q
          grep -F "template_id=source_template_id" scripts/runpod_james_batch.py

      - name: Commit exact fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/runpod_james_batch.py
          git commit -m "fix(image): pass source template id to direct deployment"
          git push origin HEAD:feat/runpod-image-studio-smoke
