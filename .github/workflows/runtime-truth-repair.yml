name: Runtime truth repair

on:
  push:
    branches:
      - fix/runtime-truth-agentrouter-2026-07-28

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-truth-agentrouter-2026-07-28
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gateway/kitty-chat/package-lock.json

      - name: Apply verified runtime repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # --- AgentRouter: documented OpenAI-compatible contract only ----------
          path = Path('gateway/llm_client.py')
          text = path.read_text()
          text = replace_once(
              text,
              'for env_name in ("AGENTROUTER_API_KEY", "AGENT_ROUTER_TOKEN"):',
              'for env_name in ("AGENT_ROUTER_TOKEN", "AGENTROUTER_API_KEY"):',
              'AgentRouter key precedence',
          )
          text = replace_once(
              text,
              'g_model = os.environ.get("AGENTROUTER_MODEL", "").strip() or "gpt-5.4-mini"',
              'g_model = os.environ.get("AGENTROUTER_MODEL", "").strip() or "gpt-5.5"',
              'AgentRouter model resolver default',
          )
          start = text.index('def _agentrouter_client_rejected')
          end = text.index('def _resolve_provider_api_key')
          text = text[:start] + text[end:]
          text = replace_once(
              text,
              '        api_key_env=("AGENTROUTER_API_KEY", "AGENT_ROUTER_TOKEN"),\n'
              '        model_default="gpt-5.4-mini",\n'
              '        # AgentRouter .env values are prone to multi-line paste errors; the\n'
              '        # dedicated resolver warns and takes the first line instead of silently\n'
              '        # shipping a corrupt Bearer token.\n'
              '        key_resolver=resolve_agentrouter_api_key,\n'
              '        model_resolver=lambda request_model: agentrouter_model_for_request(request_model),\n'
              '        request_mutator=_agentrouter_request_mutator,\n'
              '        post_processor=_agentrouter_post_processor,\n',
              '        api_key_env=("AGENT_ROUTER_TOKEN", "AGENTROUTER_API_KEY"),\n'
              '        model_default="gpt-5.5",\n'
              '        # Standard OpenAI-compatible Bearer authentication. AGENT_ROUTER_TOKEN\n'
              '        # is canonical; AGENTROUTER_API_KEY remains a legacy Kitty alias.\n'
              '        key_resolver=resolve_agentrouter_api_key,\n'
              '        model_resolver=lambda request_model: agentrouter_model_for_request(request_model),\n',
              'AgentRouter provider row',
          )
          path.write_text(text)

          # --- Completion route: truthful provider/tool state + structured trace ---
          path = Path('gateway/routes/completions.py')
          text = path.read_text()
          text = replace_once(
              text,
              '    log_chat_trace,\n    route_model,\n)',
              '    log_chat_trace,\n    route_model,\n    selected_provider_name,\n)',
              'selected provider import',
          )
          text = replace_once(
              text,
              'router = APIRouter(tags=["completions"])\n',
              'router = APIRouter(tags=["completions"])\n\n'
              '_NO_TOOL_EXECUTOR_SYSTEM = """\n'
              'This chat runtime does not currently have a tool executor. Do not emit XML, DSML,\n'
              'or tool-call syntax as ordinary assistant text. Do not claim that a command, search,\n'
              'file operation, or external action ran unless an execution result is present in the\n'
              'conversation. When execution is required, state plainly that tools are unavailable\n'
              'in this chat runtime.\n'
              '""".strip()\n',
              'no-tool system contract',
          )
          text = replace_once(
              text,
              '        system_prompt = f"{bundle.system}\\n\\n{compact_runtime_context(runtime_manifest)}"\n',
              '        system_prompt = (\n'
              '            f"{bundle.system}\\n\\n{compact_runtime_context(runtime_manifest)}"\n'
              '            f"\\n\\n{_NO_TOOL_EXECUTOR_SYSTEM}"\n'
              '        )\n',
              'no-tool prompt injection',
          )
          text = replace_once(
              text,
              '            if key not in {"project_id", "conversation_id", "conversation_title", "user_message_id", "content_class"}\n',
              '            if key not in {\n'
              '                "project_id",\n'
              '                "conversation_id",\n'
              '                "conversation_title",\n'
              '                "user_message_id",\n'
              '                "content_class",\n'
              '                # No executor exists on this endpoint. Forwarding tool schemas would\n'
              '                # invite tool calls that Kitty cannot complete.\n'
              '                "tools",\n'
              '                "tool_choice",\n'
              '                "parallel_tool_calls",\n'
              '            }\n',
              'strip unsupported tools',
          )
          marker = '    if stream:\n'
          insertion = '''    selected_provider = selected_provider_name()
    provider_label = selected_provider or "auto"
    upstream_chars = sum(
        len(str(message.get("content", "")))
        for message in enriched
        if isinstance(message, dict)
    )
    logger.info(
        "chat %s: request_trace %s",
        correlation_id,
        json.dumps(
            {
                "conversation_id": conversation_id,
                "provider_selected": provider_label,
                "client_model_requested": model_from_request,
                "model_routed": model,
                "message_count": len(enriched),
                "message_content_chars": upstream_chars,
                "system_prompt_chars": len(system_prompt),
                "memory_items_injected": len(bundle.injected_memory_items),
                "preprocessing_ms": int((time.monotonic() - t_start) * 1000),
                "tool_execution": "unavailable",
            },
            sort_keys=True,
        ),
    )

    if stream:
'''
          text = replace_once(text, marker, insertion, 'structured request trace')
          text = replace_once(
              text,
              '        lifecycle_headers = {\n'
              '            "X-Kitty-Runtime-Revision": runtime_manifest["revision"],\n'
              '            "X-Kitty-Model-Selected": model,\n'
              '        }\n',
              '        lifecycle_headers = {\n'
              '            "X-Kitty-Runtime-Revision": runtime_manifest["revision"],\n'
              '            "X-Kitty-Model-Selected": model,\n'
              '            "X-Kitty-Model-Requested": str(model_from_request),\n'
              '            "X-Kitty-Provider-Selected": provider_label,\n'
              '            "X-Kitty-Tools-State": "unavailable",\n'
              '        }\n',
              'truth headers',
          )
          path.write_text(text)

          # --- Launcher: lifecycle ownership, UI PID, launchd, truthful logs -------
          path = Path('kitty')
          text = path.read_text()
          helper_anchor = '''http_ok() {
  local url="$1"; shift
  curl -sf --max-time 3 "$@" "$url" >/dev/null 2>&1
}
'''
          helper_replacement = helper_anchor + '''
listener_pids() {
  local port="$1"
  lsof -tiTCP:"$port" -sTCP:LISTEN 2>/dev/null || true
}

pid_command() {
  ps -p "$1" -o command= 2>/dev/null || true
}

pid_cwd() {
  lsof -a -p "$1" -d cwd -Fn 2>/dev/null | sed -n 's/^n//p' | head -1
}

pid_owned_by_kitty() {
  local pid="$1"
  local command cwd
  command="$(pid_command "$pid")"
  cwd="$(pid_cwd "$pid")"
  [[ "$command" == *"$KITTY_ROOT"* || "$cwd" == "$KITTY_ROOT" || "$cwd" == "$KITTY_ROOT/"* ]]
}

stop_pidfile() {
  local svc="$1"
  local pidfile="$RUN_DIR/$svc.pid"
  if pid_alive "$pidfile"; then
    local pid
    pid="$(cat "$pidfile")"
    pkill -TERM -P "$pid" 2>/dev/null || true
    kill -TERM "$pid" 2>/dev/null || true
    echo "  $svc  stopping (pid $pid)"
  fi
  rm -f "$pidfile"
}

stop_owned_listener() {
  local label="$1" port="$2" pid
  for pid in $(listener_pids "$port"); do
    if pid_owned_by_kitty "$pid"; then
      echo "  $label  stopping owned listener pid $pid on :$port"
      pkill -TERM -P "$pid" 2>/dev/null || true
      kill -TERM "$pid" 2>/dev/null || true
    else
      echo "  $label  leaving unrelated listener pid $pid on :$port: $(pid_command "$pid")" >&2
    fi
  done
}

assert_port_available() {
  local label="$1" port="$2" pids
  pids="$(listener_pids "$port")"
  if [[ -n "$pids" ]]; then
    echo "Error: $label port :$port is already owned by pid(s): $pids" >&2
    for pid in $pids; do
      echo "  pid $pid: $(pid_command "$pid")" >&2
    done
    echo "Run './kitty down' to stop Kitty-owned listeners; unrelated listeners are never killed." >&2
    return 1
  fi
}
'''
          text = replace_once(text, helper_anchor, helper_replacement, 'launcher helpers')

          text = replace_once(
              text,
              '''  # LiteLLM
  if pid_alive "$RUN_DIR/litellm.pid"; then
    echo "  LiteLLM  already running (pid $(cat "$RUN_DIR/litellm.pid"))"
  else
    nohup bash "$KITTY_ROOT/gateway/start_litellm.sh" \\
      >"$LOG_DIR/litellm.log" 2>&1 &
    echo $! >"$RUN_DIR/litellm.pid"
    echo "  LiteLLM  started (pid $!)"
  fi

  # Gateway
  if pid_alive "$RUN_DIR/gateway.pid"; then
    echo "  Gateway  already running (pid $(cat "$RUN_DIR/gateway.pid"))"
  else
    nohup bash "$KITTY_ROOT/gateway/start_gateway.sh" \\
      >"$LOG_DIR/gateway.log" 2>&1 &
    echo $! >"$RUN_DIR/gateway.pid"
    echo "  Gateway  started (pid $!)"
  fi
''',
              '''  # LiteLLM
  if pid_alive "$RUN_DIR/litellm.pid"; then
    echo "  LiteLLM  already running (pid $(cat "$RUN_DIR/litellm.pid"))"
  else
    assert_port_available "LiteLLM" "$LITELLM_PORT"
    nohup bash "$KITTY_ROOT/gateway/start_litellm.sh" \\
      >"$LOG_DIR/litellm.log" 2>&1 &
    echo $! >"$RUN_DIR/litellm.pid"
    echo "  LiteLLM  started (pid $!)"
  fi

  # Gateway
  if pid_alive "$RUN_DIR/gateway.pid"; then
    echo "  Gateway  already running (pid $(cat "$RUN_DIR/gateway.pid"))"
  else
    assert_port_available "Gateway" "$GATEWAY_PORT"
    nohup bash "$KITTY_ROOT/gateway/start_gateway.sh" \\
      >"$LOG_DIR/gateway.log" 2>&1 &
    echo $! >"$RUN_DIR/gateway.pid"
    echo "  Gateway  started (pid $!)"
  fi
''',
              'up port ownership',
          )

          text = replace_once(
              text,
              '''  if ! http_ok "http://127.0.0.1:$UI_PORT/"; then
    echo "Starting UI on http://localhost:$UI_PORT ..."
    (cd "$KITTY_ROOT/gateway/kitty-chat" \\
      && nohup node node_modules/next/dist/bin/next dev -H 127.0.0.1 -p "$UI_PORT" \\
        >"$LOG_DIR/ui.log" 2>&1 &)
''',
              '''  if ! http_ok "http://127.0.0.1:$UI_PORT/"; then
    assert_port_available "UI" "$UI_PORT"
    echo "Starting UI on http://localhost:$UI_PORT ..."
    (cd "$KITTY_ROOT/gateway/kitty-chat" \\
      && nohup node node_modules/next/dist/bin/next dev -H 127.0.0.1 -p "$UI_PORT" \\
        >"$LOG_DIR/ui.log" 2>&1 & echo $! >"$RUN_DIR/ui.pid")
''',
              'UI PID tracking',
          )

          down_pattern = re.compile(r'''cmd_down\(\) \{\n.*?\n\}\n\ncmd_status\(\) \{''', re.S)
          down_replacement = '''cmd_down() {
  echo "Stopping Kitty..."

  # Disable launchd jobs first. Their KeepAlive=true setting otherwise restarts
  # a process immediately after it is killed and leaves the old port occupied.
  for svc in gateway litellm; do
    if launchctl print "gui/$(id -u)/com.kitty.$svc" >/dev/null 2>&1; then
      launchctl bootout "gui/$(id -u)/com.kitty.$svc" 2>/dev/null || true
      echo "  $svc  launchd job stopped"
    fi
  done

  for svc in ui gateway litellm; do
    stop_pidfile "$svc"
  done

  stop_owned_listener "UI" "$UI_PORT"
  stop_owned_listener "Gateway" "$GATEWAY_PORT"
  stop_owned_listener "LiteLLM" "$LITELLM_PORT"
  sleep 2

  for spec in "UI:$UI_PORT" "Gateway:$GATEWAY_PORT" "LiteLLM:$LITELLM_PORT"; do
    label="${spec%%:*}"
    port="${spec##*:}"
    for pid in $(listener_pids "$port"); do
      if pid_owned_by_kitty "$pid"; then
        echo "  $label  force-stopping owned listener pid $pid on :$port"
        kill -KILL "$pid" 2>/dev/null || true
      fi
    done
  done

  rm -f "$RUN_DIR/ui.pid" "$RUN_DIR/gateway.pid" "$RUN_DIR/litellm.pid"
}

cmd_status() {'''
          text, count = down_pattern.subn(down_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'cmd_down replacement: expected one match, found {count}')

          text = replace_once(
              text,
              '  for svc in gateway litellm; do\n',
              '  for svc in ui gateway litellm; do\n',
              'status includes UI',
          )
          text = replace_once(
              text,
              '''  echo
  echo "Frontend: http://localhost:4000 (run separately: cd gateway/kitty-chat && npm run dev)"
''',
              '''  echo
  echo "Listeners"
  echo "─────────"
  for spec in "UI:$UI_PORT" "Gateway:$GATEWAY_PORT" "LiteLLM:$LITELLM_PORT"; do
    label="${spec%%:*}"
    port="${spec##*:}"
    pids="$(listener_pids "$port")"
    if [[ -n "$pids" ]]; then
      printf "  %-10s :%s pid(s) %s\n" "$label" "$port" "$pids"
    else
      printf "  %-10s :%s free\n" "$label" "$port"
    fi
  done
''',
              'status listener report',
          )
          text = replace_once(
              text,
              '''cmd_logs() {
  echo "Tailing logs/gateway.log and logs/litellm.log (Ctrl-C to stop)..."
  tail -f "$LOG_DIR/gateway.log" "$LOG_DIR/litellm.log" 2>/dev/null || \\
    echo "No log files yet — run: kitty up"
}
''',
              '''cmd_logs() {
  echo "Tailing gateway, LiteLLM, and UI logs (Ctrl-C to stop)..."
  touch "$LOG_DIR/gateway.log" "$LOG_DIR/litellm.log" "$LOG_DIR/ui.log"
  tail -F "$LOG_DIR/gateway.log" "$LOG_DIR/litellm.log" "$LOG_DIR/ui.log"
}
''',
              'truthful logs command',
          )
          path.write_text(text)

          # --- Frontend: carry server truth; never present a tool request as execution ---
          path = Path('gateway/kitty-chat/src/lib/types.ts')
          text = path.read_text()
          text = replace_once(
              text,
              '  model?: string\n  mood?: KittyMood\n',
              '  model?: string\n  provider?: string\n  requestedModel?: string\n  toolsState?: \'available\' | \'unavailable\'\n  mood?: KittyMood\n',
              'message runtime metadata',
          )
          path.write_text(text)

          path = Path('gateway/kitty-chat/src/lib/chat-client.ts')
          text = path.read_text()
          text = replace_once(
              text,
              '  toolCalls?: ToolCall[];\n}',
              '  toolCalls?: ToolCall[];\n  provider?: string;\n  requestedModel?: string;\n  toolsState?: \'available\' | \'unavailable\';\n}',
              'stream runtime metadata',
          )
          text = replace_once(
              text,
              '  const reader = response.body?.getReader();\n',
              '  const provider = response.headers.get(\'X-Kitty-Provider-Selected\') ?? undefined;\n'
              '  const requestedModel = response.headers.get(\'X-Kitty-Model-Requested\') ?? undefined;\n'
              '  const rawToolsState = response.headers.get(\'X-Kitty-Tools-State\');\n'
              '  const toolsState = rawToolsState === \'available\' || rawToolsState === \'unavailable\'\n'
              '    ? rawToolsState\n'
              '    : undefined;\n'
              '  if (provider || requestedModel || toolsState) {\n'
              '    yield { content: \'\', done: false, provider, requestedModel, toolsState };\n'
              '  }\n\n'
              '  const reader = response.body?.getReader();\n',
              'read truth headers',
          )
          path.write_text(text)

          path = Path('gateway/kitty-chat/src/state/KittyContext.tsx')
          text = path.read_text()
          text = replace_once(
              text,
              '    let memoryItems: MemoryEvidence[] | undefined\n    let toolCalls: import(\'@/lib/types\').ToolCall[] | undefined\n',
              '    let memoryItems: MemoryEvidence[] | undefined\n'
              '    let toolCalls: import(\'@/lib/types\').ToolCall[] | undefined\n'
              '    let provider: string | undefined\n'
              '    let requestedModel: string | undefined\n'
              '    let toolsState: \'available\' | \'unavailable\' | undefined\n',
              'stream metadata state',
          )
          text = replace_once(
