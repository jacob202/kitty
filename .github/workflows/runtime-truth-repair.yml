          path = Path('.env.example')
          text = path.read_text()
          start = text.index('# AgentRouter —')
          end = text.index('# Librarian / knowledge ingestion')
          replacement = '''# AgentRouter.org — standard OpenAI-compatible chat provider.
# Canonical credential name:
AGENT_ROUTER_TOKEN=
# Legacy Kitty alias (accepted only when AGENT_ROUTER_TOKEN is absent):
# AGENTROUTER_API_KEY=
AGENTROUTER_API_BASE=https://agentrouter.org/v1
AGENTROUTER_MODEL=gpt-5.5

'''
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Validate Python and launcher
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio
          bash -n kitty
          ruff check gateway/ tests/
          pytest -q \
            tests/test_agentrouter_config.py \
            tests/test_llm_client.py \
            tests/test_active_provider_routing.py \
            tests/test_provider_prefs.py \
            tests/test_kitty_launcher_runtime.py

      - name: Validate frontend
        working-directory: gateway/kitty-chat
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit validated repair
        run: |
          rm .github/workflows/runtime-truth-repair.yml
          git config user.name 'Kitty runtime repair worker'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make runtime lifecycle provider and tool state truthful'
          git push origin HEAD:fix/runtime-truth-agentrouter-2026-07-28
