name: PR Agent Review

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  # review-concurrency-class: one review run per PR at a time.
  # Grouping by event action let runs for the same PR -- and the same head --
  # overlap, and two overlapping runs can publish contradictory evidence into the
  # same comment: a clean run could erase a real finding and let policy-gate
  # approve the head. Serialising removes that race by construction, so the
  # guards in scripts/pr_review.py are defence in depth rather than the only
  # protection. GitHub keeps one pending run per group, so bursty events collapse
  # to the newest queued run instead of cancelling the review already in flight;
  # a cancelled review produces no verdict, which is the failure mode this
  # workflow exists to avoid.
  # merge_group carries no pull_request.number; head_ref is unique per queue
  # entry (gh-readonly-queue/<base>/pr-<N>-<sha>) so entries stay independent.
  group: pr-agent-review-${{ github.event.pull_request.number || github.event.merge_group.head_ref }}
  cancel-in-progress: false

jobs:
  scope:
    name: scope
    # policy-gate is a required check in the merge queue, so scope (and
    # policy-gate below) must run for merge_group too, or the queue entry
    # blocks forever waiting for a check nothing ever reports.
    if: ${{ github.event_name == 'merge_group' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    outputs:
      sensitive: ${{ steps.scope.outputs.sensitive }}
    steps:
      - name: Checkout trusted default-branch classifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Classify change scope
        id: scope
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.pr_scope

  agent-review:
    name: agent-review
    # Review standalone PRs and both merge boundaries of a stack automatically with
    # the cheap paid OpenCode reviewer. Sensitive stack layers still get their own
    # exact-head review. Review reliability is worth the tiny Flash cost; explicit Builder
    # `--free` semantics remain separate and never silently spend. Ordinary PRs
    # do not depend on the model result; sensitive PRs
    # still require exact-head approval evidence through policy-gate.
    #
    # Metadata events (edited/labeled/unlabeled) deliberately do not recall the
    # model: policy-gate re-evaluates live PR state on those events, but the code
    # head under review has not changed.
    needs: scope
    if: >-
      ${{ github.event.pull_request.draft == false &&
          github.event.pull_request.author_association == 'OWNER' &&
          (github.event.pull_request.stack == null ||
           github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref ||
           github.event.pull_request.stack.position == github.event.pull_request.stack.size ||
           needs.scope.outputs.sensitive == 'true') &&
          (github.event.action == 'opened' ||
           github.event.action == 'synchronize' ||
           github.event.action == 'reopened' ||
           github.event.action == 'ready_for_review') }}
    runs-on: ubuntu-latest
    # A review can spend up to PR_REVIEW_TOTAL_TIMEOUT_SECONDS on models, plus
    # several 30-second GitHub API ceilings for the diff, the pending marker, the
    # override probe and the failure comment, plus checkout/Python/Bun/OpenCode
    # setup. 25 minutes leaves real slack above that 900s budget instead of ~60
    # seconds, so the job publishes a verdict or an explicit failure rather than
    # being cancelled mid-review. tests/test_ci_gate_workflows.py asserts the
    # reserve so these numbers cannot drift apart.
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - name: Checkout trusted default-branch reviewer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install OpenCode
        run: bun install --global opencode-ai

      - name: Produce exact-head model review evidence
        id: produce
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_REVIEW_MODEL: "openrouter/deepseek/deepseek-v4-flash"
          PR_REVIEW_FALLBACK_MODEL: "openrouter/minimax/minimax-m3"
          PR_REVIEW_DEEPSEEK_MODEL: "openrouter/minimax/minimax-m3"
          PR_REVIEW_DEEPSEEK_FALLBACK_MODEL: "openrouter/qwen/qwen3.7-plus"
          # Measured on a real 53 KB review chunk (PR #853, 106 KB / 2 chunks):
          # deepseek-v4-flash answered in 163s. The previous 90s ceiling meant the
          # primary model timed out on every sufficiently large diff, the fallback
          # timed out too, and the job posted no verdict at all.
          PR_REVIEW_MODEL_TIMEOUT_SECONDS: "240"
          # Bounds the whole review (all chunks, all fallback models) below the
          # job cap, so the job always publishes a verdict or an explicit failure.
          PR_REVIEW_TOTAL_TIMEOUT_SECONDS: "900"
          PR_REVIEW_AGENT: "pr-reviewer"
        run: python scripts/pr_review.py

  policy-gate:
    name: policy-gate
    # policy-gate classifies the live PR itself rather than trusting the scope
    # job's answer, so a failed or skipped scope job can never downgrade a
    # sensitive PR into one that needs no review evidence. Must also run for
    # merge_group (see scope's if, above) — it is a required check.
    if: ${{ always() && (github.event_name == 'merge_group' || github.event.pull_request.draft == false) }}
    needs: [scope, agent-review]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default-branch policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Enforce trusted merge policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.pr_policy
