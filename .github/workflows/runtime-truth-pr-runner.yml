name: Apply runtime truth repair

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'fix/runtime-truth-agentrouter-2026-07-28'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-truth-agentrouter-2026-07-28
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gateway/kitty-chat/package-lock.json

      - name: Extract and apply the reviewed patch
        id: apply
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/runtime-truth-repair.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate Python and launcher"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          extracted = workflow[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in extracted.splitlines()
          ) + '\n'

          old = '\n'.join([
              'text = replace_once(',
              '    text,',
              "    '  for svc in gateway litellm; do\\n',",
              "    '  for svc in ui gateway litellm; do\\n',",
              "    'status includes UI',",
              ')',
              '',
          ])
          new = '\n'.join([
              "status_start = text.index('cmd_status() {')",
              "status_end = text.index('\\n}\\n\\ncmd_logs()', status_start)",
              'status_block = text[status_start:status_end]',
              'status_block = replace_once(',
              '    status_block,',
              "    '  for svc in gateway litellm; do\\n',",
              "    '  for svc in ui gateway litellm; do\\n',",
              "    'status includes UI',",
              ')',
              'text = text[:status_start] + status_block + text[status_end:]',
              '',
          ])
          if script.count(old) != 1:
              raise SystemExit(f'runner patch expected one status block, found {script.count(old)}')
          script = script.replace(old, new, 1)

          tool_start_marker = "text = replace_once(\n    text,\n    '''                {message.toolCalls"
          tool_end_marker = "text = replace_once(\n    text,\n    '''function Attribution"
          tool_start = script.index(tool_start_marker)
          tool_end = script.index(tool_end_marker, tool_start)
          tool_patch = '\n'.join([
              "tool_pattern = re.compile(",
              "    r'(?P<indent>^[ \\t]*)\\{message\\.toolCalls && message\\.toolCalls\\.length > 0 && \\($'",
              "    r'\\n^[ \\t]*<ToolCallList toolCalls=\\{message\\.toolCalls\\} isStreaming=\\{isStreaming\\} />$'",
              "    r'\\n^[ \\t]*\\)\\}$',",
              "    re.MULTILINE,",
              ")",
              "",
              "def replace_tool_call_display(match: re.Match[str]) -> str:",
              "    indent = match.group('indent')",
              "    return '\\n'.join([",
              "        f'{indent}{{message.toolCalls && message.toolCalls.length > 0 && (',",
              "        f\"{indent}  <div role=\\\"status\\\" style={{{{ marginTop: 8, fontSize: 11, color: 'var(--ink-2)' }}}}>\",",
              "        f'{indent}    Tool request detected — not executed by this chat runtime.',",
              "        f'{indent}  </div>',",
              "        f'{indent})}}',",
              "    ])",
              "",
              "text, count = tool_pattern.subn(replace_tool_call_display, text, count=1)",
              "if count != 1:",
              "    raise SystemExit(f'honest tool display: expected one match, found {count}')",
              "",
          ])
          script = script[:tool_start] + tool_patch + script[tool_end:]

          launcher_test_writer = "Path('tests/test_kitty_launcher_runtime.py').write_text('''"
          if script.count(launcher_test_writer) != 1:
              raise SystemExit('launcher test writer marker missing')
          script = script.replace(launcher_test_writer, launcher_test_writer[:-3] + "r'''", 1)

          Path('/tmp/runtime_truth_repair.py').write_text(script)
          PY
          python /tmp/runtime_truth_repair.py > /tmp/runtime-truth-repair.log 2>&1
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('tests/test_llm_client.py')
          text = path.read_text()
          obsolete = [
              'test_agentrouter_request_mutator_adds_headers',
              'test_agentrouter_request_mutator_loads_extra_json_headers',
              'test_agentrouter_request_mutator_ignores_bad_extra_json',
              'test_agentrouter_client_rejected_matches_401_unauthorized_client',
              'test_agentrouter_client_rejected_non_401',
              'test_agentrouter_client_rejected_none',
          ]
          for name in obsolete:
              pattern = re.compile(rf'\n\ndef {name}\(.*?(?=\n\ndef |\Z)', re.S)
              text, count = pattern.subn('', text, count=1)
              if count != 1:
                  raise SystemExit(f'obsolete AgentRouter test not found: {name}')
          path.write_text(text.rstrip() + '\n')

          path = Path('gateway/kitty-chat/tests/ChatMessage.test.tsx')
          text = path.read_text()
          replacements = {
              "  it('shows who answered via the producing model', () => {": "  it('shows the requested model without claiming it produced the reply', () => {",
              "    expect(screen.getByText(/answered by sonnet-4/)).toBeInTheDocument()": "    expect(screen.getByText(/automatic routing · requested sonnet-4/)).toBeInTheDocument()",
              "    expect(screen.getByText(/answered by opus-4/)).toBeInTheDocument()": "    expect(screen.getByText(/automatic routing · requested opus-4/)).toBeInTheDocument()",
              "    expect(screen.queryByText(/answered by/)).not.toBeInTheDocument()": "    expect(screen.queryByText(/automatic routing/)).not.toBeInTheDocument()",
          }
          for old_text, new_text in replacements.items():
              if old_text not in text:
                  raise SystemExit(f'ChatMessage test marker missing: {old_text}')
              text = text.replace(old_text, new_text)
          truth_test = '\n'.join([
              '',
              "  it('shows provider, requested model, and unavailable tool state honestly', () => {",
              '    renderMessage({',
              '      ...kittyMsg,',
              "      provider: 'agentrouter',",
              "      requestedModel: 'gpt-5.5',",
              "      toolsState: 'unavailable',",
              "      content: 'checked it.',",
              '    })',
              '    expect(screen.getByText(/agentrouter · requested gpt-5.5/)).toBeInTheDocument()',
              "    expect(screen.getByText('tools unavailable')).toBeInTheDocument()",
              '  })',
              '',
          ])
          anchor = "\n  it('surfaces council routing as expert chips', () => {"
          if text.count(anchor) != 1:
              raise SystemExit('ChatMessage truth-test anchor missing')
          text = text.replace(anchor, truth_test + anchor, 1)
          path.write_text(text)
          PY

      - name: Upload repair diagnostics
        if: steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-truth-repair-diagnostics
          path: |
            /tmp/runtime_truth_repair.py
            /tmp/runtime-truth-repair.log
          if-no-files-found: error
          retention-days: 1

      - name: Surface repair failure
        if: steps.apply.outcome == 'failure'
        run: |
          cat /tmp/runtime-truth-repair.log
          exit 1

      - name: Validate Python and launcher
        id: python_validation
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install ruff pytest pytest-asyncio
            bash -n kitty
            ruff check --fix tests/test_kitty_launcher_runtime.py
            ruff check gateway/ tests/
            pytest -q \
              tests/test_agentrouter_config.py \
              tests/test_llm_client.py \
              tests/test_active_provider_routing.py \
              tests/test_provider_prefs.py \
              tests/test_kitty_launcher_runtime.py
          } 2>&1 | tee /tmp/runtime-truth-python-validation.log

      - name: Upload Python validation diagnostics
        if: steps.python_validation.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-truth-python-validation
          path: /tmp/runtime-truth-python-validation.log
          if-no-files-found: error
          retention-days: 1

      - name: Surface Python validation failure
        if: steps.python_validation.outcome == 'failure'
        run: |
          tail -200 /tmp/runtime-truth-python-validation.log
          exit 1

      - name: Validate frontend
        id: frontend_validation
        if: steps.python_validation.outcome == 'success'
        continue-on-error: true
        working-directory: gateway/kitty-chat
        run: |
          set -o pipefail
          {
            npm ci
            npm test
            npm run build
          } 2>&1 | tee /tmp/runtime-truth-frontend-validation.log

      - name: Upload frontend validation diagnostics
        if: steps.frontend_validation.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-truth-frontend-validation
          path: /tmp/runtime-truth-frontend-validation.log
          if-no-files-found: error
          retention-days: 1

      - name: Surface frontend validation failure
        if: steps.frontend_validation.outcome == 'failure'
        run: |
          tail -200 /tmp/runtime-truth-frontend-validation.log
          exit 1

      - name: Commit validated repair
        if: steps.frontend_validation.outcome == 'success'
        run: |
          rm -f \
            .github/workflows/runtime-truth-repair.yml \
            .github/workflows/runtime-truth-pr-runner.yml \
            .github/runtime-truth-trigger
          git config user.name 'Kitty runtime repair worker'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make runtime lifecycle provider and tool state truthful'
          git push origin HEAD:fix/runtime-truth-agentrouter-2026-07-28
