name: Ruff diagnostic

on:
  pull_request:
  push:
    branches:
      - spike/foundation-replacement-clean-2026-07-27

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Capture Ruff output
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check gateway/ tests/ mcp/ > ruff-output.txt 2>&1 || true
      - name: Upload diagnostic
        uses: actions/upload-artifact@v7
        with:
          name: ruff-diagnostic
          path: ruff-output.txt
          retention-days: 1
