name: RunPod Live Probe

on:
  push:
    branches: [feat/runpod-image-studio-smoke]
    paths:
      - .github/runpod-live-probe.trigger

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Announce probe
        run: |
          gh pr comment 306 --repo "$GITHUB_REPOSITORY" --body \
            "RunPod live startup probe: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install httpx==0.28.1

      - name: Probe active Kitty Pod
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import httpx

          headers = {"Authorization": f"Bearer {os.environ['RUNPOD_API_KEY']}"}
          with httpx.Client(timeout=30, follow_redirects=True) as client:
              response = client.get("https://rest.runpod.io/v1/pods", headers=headers)
              response.raise_for_status()
              pods = [
                  pod for pod in response.json()
                  if str(pod.get("name") or "").startswith("kitty-image-james-")
              ]
              print("MATCHING_PODS=" + json.dumps([
                  {
                      "id": pod.get("id"),
                      "name": pod.get("name"),
                      "desiredStatus": pod.get("desiredStatus"),
                      "dockerEntrypoint": pod.get("dockerEntrypoint"),
                      "dockerStartCmd": pod.get("dockerStartCmd"),
                      "ports": pod.get("ports"),
                      "lastStatusChange": pod.get("lastStatusChange"),
                  }
                  for pod in pods
              ], sort_keys=True))
              for pod in pods:
                  pod_id = pod.get("id")
                  if not pod_id:
                      continue
                  try:
                      health = client.get(f"https://{pod_id}-8000.proxy.runpod.net/health")
                      print(
                          f"HEALTH pod={pod_id} status={health.status_code} "
                          f"server={health.headers.get('server')} body={health.text[:500]}"
                      )
                  except Exception as exc:
                      print(f"HEALTH pod={pod_id} error={exc}")
          PY
