name: PR 672 staged repair

on:
  push:
    branches: [ staging/pr672-fail-closed-20260829 ]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[pr672-applied]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway/kitty-chat
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: staging/pr672-fail-closed-20260829

      - name: Apply bounded source patch
        working-directory: .
        run: python scripts/apply_pr672_fail_closed.py

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/kitty-chat/package-lock.json

      - name: Install
        run: npm ci

      - name: Focused regressions
        run: npx vitest run tests/modelAvailabilityFailClosed.test.tsx tests/gatewayIntegration.test.tsx tests/PageSurfaceLayout.test.ts

      - name: Full frontend tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Diff check
        working-directory: .
        run: git diff --check

      - name: Commit verified source repair
        working-directory: .
        run: |
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          test "$(git status --short gateway/kitty-chat/src/lib/gateway.ts | wc -l | tr -d ' ')" = "1"
          test "$(git status --short gateway/kitty-chat/src/app/page.tsx | wc -l | tr -d ' ')" = "1"
          test "$(git status --short gateway/kitty-chat/tests/gatewayIntegration.test.tsx | wc -l | tr -d ' ')" = "1"
          test "$(git status --short gateway/kitty-chat/tests/PageSurfaceLayout.test.ts | wc -l | tr -d ' ')" = "1"
          test "$(git status --short | wc -l | tr -d ' ')" = "4"
          git config user.name "kitty-closeout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            gateway/kitty-chat/src/lib/gateway.ts \
            gateway/kitty-chat/src/app/page.tsx \
            gateway/kitty-chat/tests/gatewayIntegration.test.tsx \
            gateway/kitty-chat/tests/PageSurfaceLayout.test.ts
          git commit -m "[pr672-applied] fix(chat): fail closed when curated models are unavailable"
          git push origin HEAD:staging/pr672-fail-closed-20260829
