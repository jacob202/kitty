name: Fix RunPod Direct Create Schema

on:
  push:
    branches: [feat/runpod-image-studio-smoke]
    paths:
      - .github/runpod-fix-omit-template.trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runpod-image-studio-smoke
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Omit templateId from direct-image Pod create
        run: |
          python - <<'PY'
          from pathlib import Path

          control = Path("gateway/runpod_control.py")
          text = control.read_text(encoding="utf-8")
          old = '            "templateId": None,\n'
          if text.count(old) != 1:
              raise SystemExit(f"expected one templateId null field, found {text.count(old)}")
          control.write_text(text.replace(old, "", 1), encoding="utf-8")

          tests = Path("tests/test_runpod_control.py")
          text = tests.read_text(encoding="utf-8")
          old = '    assert captured["templateId"] is None\n'
          new = '    assert "templateId" not in captured\n'
          if text.count(old) != 1:
              raise SystemExit(f"expected one templateId assertion, found {text.count(old)}")
          tests.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify focused code
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.4.1 pytest-asyncio==1.1.0 httpx==0.28.1
          python -m py_compile gateway/runpod_control.py
          python -m pytest tests/test_runpod_control.py -q

      - name: Commit fix and remove helper
        run: |
          rm .github/workflows/runpod-fix-omit-template.yml
          rm .github/runpod-fix-omit-template.trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(image): omit template id for direct RunPod create"
          git push origin HEAD:feat/runpod-image-studio-smoke
