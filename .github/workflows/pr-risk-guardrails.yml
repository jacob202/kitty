name: PR Risk Guardrails

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  risk-guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Detect risky scope and enforce explicit approval
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const action = context.payload.action;

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            const headSha = pr.head.sha;
            const prBody = pr.body || "";
            // Dependabot cannot author the repo-specific approval receipt itself.
            // Keep this legacy guardrail non-blocking only for its exact login;
            // the required deterministic `pr-policy` remains the merge authority.
            const isDependabot = pr.user.login === "dependabot[bot]";
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100
            });
            const changed = files.map((f) => f.filename);

            const riskyPatterns = [
              /^\.github\/workflows\//,
              /^\.github\/dependabot\.yml$/,
              /^gateway\/routes\/auth/i,
              /^gateway\/auth/i,
              /^gateway\/security/i,
              /^gateway\/.*secret/i,
              /^.*\.env(\..*)?$/,
              /^requirements.*\.txt$/,
              /^pyproject\.toml$/,
            ];
            const riskyFiles = changed.filter((path) => riskyPatterns.some((pattern) => pattern.test(path)));
            const isRisky = riskyFiles.length > 0;

            const requiredLabels = [
              { name: "risk/high", color: "b60205", description: "Touches sensitive or high-risk scope" },
              { name: "risk/manual-approval", color: "d93f0b", description: "Requires explicit manual approval" },
              { name: "risk/approved", color: "0e8a16", description: "Explicit approval for the current risky PR head" },
            ];
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner, repo, per_page: 100,
            });
            const existingNames = new Set(existing.map((label) => label.name));
            for (const label of requiredLabels) {
              if (!existingNames.has(label.name)) {
                await github.rest.issues.createLabel({ owner, repo, ...label });
              }
            }

            let currentLabels = new Set((pr.labels || []).map((label) => label.name));

            // A risky approval belongs to one code head. A push invalidates it before
            // the required PR policy can be satisfied again.
            if (action === "synchronize" && currentLabels.has("risk/approved")) {
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: pull_number, name: "risk/approved",
              }).catch(() => {});
              currentLabels.delete("risk/approved");
            }
            const hasApprovalLabel = currentLabels.has("risk/approved");
            const riskApprovalPattern = new RegExp(
              `^Risk approval:\s*APPROVE\s+${headSha}\s+[—-]\s+.+$`,
              "mi",
            );
            const hasApprovalReceipt = riskApprovalPattern.test(prBody);
            const hasManualApproval = hasApprovalLabel && hasApprovalReceipt;

            if (isRisky) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pull_number,
                labels: ["risk/high", "risk/manual-approval"],
              });
            } else {
              for (const name of ["risk/high", "risk/manual-approval", "risk/approved"]) {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: pull_number, name,
                }).catch(() => {});
              }
            }

            const marker = "<!-- risk-guardrails -->";
            const guardrailBody = [
              marker,
              "### Risk guardrail status",
              `- risky files detected: ${isRisky ? "yes" : "no"}`,
              ...(isRisky ? riskyFiles.map((f) => `  - \`${f}\``) : []),
              `- current-head approval label present: ${hasApprovalLabel ? "yes" : "no"}`,
              `- exact-head approval receipt present: ${hasApprovalReceipt ? "yes" : "no"}`,
              isRisky && !hasManualApproval
                ? `- action required: apply \`risk/approved\` and add \`Risk approval: APPROVE ${headSha} — <reason>\` to the PR body.`
                : "- action required: none",
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pull_number, per_page: 100,
            });
            const existingComment = comments.find((c) => c.user?.type === "Bot" && c.body?.includes(marker));
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existingComment.id, body: guardrailBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pull_number, body: guardrailBody,
              });
            }

            if (isRisky && !hasManualApproval && !isDependabot) {
              core.setFailed("Risky scope requires `risk/approved` plus an exact-head `Risk approval: APPROVE <full-head-SHA> — <reason>` receipt.");
            } else if (isRisky && !hasManualApproval && isDependabot) {
              core.warning("Dependabot risky scope is labeled but this legacy guardrail is non-blocking; `pr-policy` still governs merge readiness.");
            }
