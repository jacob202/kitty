name: Trigger RunPod Startup Fix

on:
  push:
    branches: [feat/runpod-image-studio-smoke]
    paths:
      - .github/runpod-startup-fix.trigger

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runpod-image-studio-smoke
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Extract and apply verified patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/runpod-apply-startup-fix.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Run focused tests"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          Path('/tmp/apply_runpod_fix.py').write_text(
              textwrap.dedent(workflow[start:end]), encoding='utf-8'
          )
          PY
          python /tmp/apply_runpod_fix.py

      - name: Run focused tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.4.1 pytest-asyncio==1.1.0 httpx==0.28.1
          python -m pytest tests/test_runpod_control.py -q

      - name: Commit verified fix
        shell: bash
        run: |
          rm .github/workflows/runpod-apply-startup-fix.yml
          rm .github/workflows/runpod-apply-startup-fix-trigger.yml
          rm .github/runpod-startup-fix.trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(image): deploy worker with explicit REST startup overrides"
          git push origin HEAD:feat/runpod-image-studio-smoke
