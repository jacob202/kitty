name: Verify KTF free-exec gates once

on:
  push:
    branches:
      - docs/ktf-001-free-exec-packets

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/ktf-001-free-exec-packets
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Prove both acceptance gates fail before implementation
        id: falsifiability
        run: |
          set +e
          grep -q '"roadmap",' gateway/context_receipt.py && grep -q 'test_receipt_requires_roadmap_authority' tests/test_context_receipt.py
          fe1=$?
          grep -q 'daylight unattended Builder pass on the canonical machine' .claude/STATE.md && grep -q 'daylight unattended Builder pass on the canonical machine' .claude/HANDOFF.md && ! grep -q 'KX-06-01' .claude/STATE.md && ! grep -q 'KX-06-01' .claude/HANDOFF.md
          fe2=$?
          set -e
          echo "fe1=$fe1" >> "$GITHUB_OUTPUT"
          echo "fe2=$fe2" >> "$GITHUB_OUTPUT"
          test "$fe1" -ne 0
          test "$fe2" -ne 0

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate manifest
        run: |
          ./kitty builder initiative validate docs/initiatives/ktf-001-free-exec-v1.json | tee /tmp/manifest-validation.txt

      - name: Record durable evidence
        env:
          FE1: ${{ steps.falsifiability.outputs.fe1 }}
          FE2: ${{ steps.falsifiability.outputs.fe2 }}
        run: |
          {
            echo '# KTF-001 free-exec gate evidence'
            echo
            echo '- **Verified on branch:** `docs/ktf-001-free-exec-packets`'
            echo "- **Pre-implementation gate KTF-FE-01:** exit \`$FE1\` (non-zero required)"
            echo "- **Pre-implementation gate KTF-FE-02:** exit \`$FE2\` (non-zero required)"
            echo '- **Manifest validator:** exit `0`'
            echo
            echo 'Both packet gates were executed against the unmodified implementation tree. Neither packet implementation is present in this PR, so a zero exit would have invalidated the packet contract.'
            echo
            echo '## Validator output'
            echo
            echo '```text'
            cat /tmp/manifest-validation.txt
            echo '```'
          } > docs/initiatives/KTF-001-free-exec-gate-evidence.md

      - name: Commit evidence and remove one-shot workflow
        run: |
          rm .github/workflows/verify-ktf-free-exec-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/initiatives/KTF-001-free-exec-gate-evidence.md .github/workflows/verify-ktf-free-exec-once.yml
          git commit -m "test(builder): record free-exec gate falsifiability"
          git push origin HEAD:docs/ktf-001-free-exec-packets
