name: Apply Direct REST RunPod Fix

on:
  push:
    branches: [feat/runpod-image-studio-smoke]
    paths:
      - .github/runpod-direct-rest-fix.trigger

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Announce patch run
        run: |
          gh pr comment 306 --repo "$GITHUB_REPOSITORY" --body \
            "Direct REST startup patch: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: actions/checkout@v4
        with:
          ref: feat/runpod-image-studio-smoke
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply direct REST deployment patch
        run: python scripts/apply_runpod_direct_rest_fix.py

      - name: Run focused verification
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.4.1 pytest-asyncio==1.1.0 httpx==0.28.1 pillow==11.3.0
          python -m pytest tests/test_runpod_control.py -q
          python -m py_compile gateway/runpod_control.py scripts/runpod_james_batch.py

      - name: Commit verified fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gateway/runpod_control.py scripts/runpod_james_batch.py tests/test_runpod_control.py
          git commit -m "fix(image): launch worker directly from image startup"
          git push origin HEAD:feat/runpod-image-studio-smoke
