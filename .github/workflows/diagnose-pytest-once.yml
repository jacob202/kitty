name: Diagnose pytest once

on:
  push:
    branches:
      - fix/restore-ci-installs

permissions:
  contents: write

jobs:
  diagnose-pytest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      KITTY_EXPECTED_CANONICAL_CHECKOUT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-ci-installs
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run exact pytest gate
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
          set +e
          python -m pytest tests/ -q --tb=short --cov=gateway --cov-report=term-missing --cov-fail-under=73 > /tmp/pytest.log 2>&1
          status=$?
          {
            echo "exit_status=$status"
            echo
            tail -n 500 /tmp/pytest.log
          } > .ci-pytest-diagnostic.txt
          exit 0

      - name: Commit diagnostic and remove bootstrap workflow
        run: |
          rm .github/workflows/diagnose-pytest-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-pytest-diagnostic.txt .github/workflows/diagnose-pytest-once.yml
          git commit -m "chore(ci): capture pytest diagnostic"
          git push origin HEAD:fix/restore-ci-installs
