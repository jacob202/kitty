name: PR Description Check

on:
  pull_request:
    types: [opened, edited, synchronize]

# Without an explicit block this job inherits the repository default, which is
# read-only, so its "what's missing" comment failed with `Resource not
# accessible by integration` and authors only saw a bare red X.
permissions:
  contents: read
  pull-requests: write

jobs:
  check-description:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            // Dependabot writes its own changelog-shaped body and cannot be
            // told to emit `## Summary` / `## Test plan`, so a hard failure
            // here pins every dependency PR red forever. Same waiver, same
            // reasoning, and the same exact-login match as the risk-guardrails
            // gate — `endsWith("[bot]")` would hand the waiver to Copilot and
            // any future app opening PRs that carry real code.
            const isDependabot = pr.user.login === "dependabot[bot]";
            if (isDependabot) {
              core.info("Dependabot PR — description gate waived, not enforced.");
              return;
            }

            const body = pr.body || '';
            const missing = [];
            if (!body.includes('## Summary')) missing.push('`## Summary` section');
            if (!body.includes('## Test plan')) missing.push('`## Test plan` section');

            const summaryMatch = body.match(/## Summary\s*([\s\S]*?)(?=##|$)/);
            const testMatch = body.match(/## Test plan\s*([\s\S]*?)(?=##|$)/);
            if (summaryMatch && !summaryMatch[1].trim().match(/^-\s/m)) missing.push('at least one bullet under `## Summary`');
            if (testMatch && !testMatch[1].trim().match(/^-\s|\[.]/m)) missing.push('at least one bullet or checklist item under `## Test plan`');

            if (missing.length > 0) {
              const msg = `PR description is missing:\n${missing.map(m => `- ${m}`).join('\n')}\n\nExpected format:\n\`\`\`\n## Summary\n- what changed and why\n\n## Test plan\n- [ ] how to verify\n\`\`\``;
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: msg
                });
              } catch (err) {
                core.warning(`Could not post comment: ${err.message}`);
              }
              core.setFailed(msg);
            }
