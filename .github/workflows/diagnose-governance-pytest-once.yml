name: Diagnose governance pytest once

on:
  push:
    branches:
      - claude/alignment-map-packet-audit-xbsbbi

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      KITTY_EXPECTED_CANONICAL_CHECKOUT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/alignment-map-packet-audit-xbsbbi
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
          set +e
          python -m pytest tests/test_cold_start_acceptance.py -vv --tb=long > /tmp/governance-pytest.log 2>&1
          status=$?
          {
            echo "exit_status=$status"
            echo
            cat /tmp/governance-pytest.log
          } > .ci-governance-pytest-diagnostic.txt
          exit 0
      - name: Commit diagnostic and remove workflow
        run: |
          rm .github/workflows/diagnose-governance-pytest-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-governance-pytest-diagnostic.txt .github/workflows/diagnose-governance-pytest-once.yml
          git commit -m "chore(ci): capture governance pytest failure"
          git push origin HEAD:claude/alignment-map-packet-audit-xbsbbi
