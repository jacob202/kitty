name: Report Direct REST Run

on:
  push:
    branches: [feat/runpod-image-studio-smoke]
    paths:
      - .github/report-direct-rest-run.trigger

permissions:
  actions: read
  pull-requests: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report latest direct REST run
        run: |
          DATA="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow runpod-apply-direct-rest-fix.yml --limit 3 --json databaseId,status,conclusion,url,headSha)"
          gh pr comment 306 --repo "$GITHUB_REPOSITORY" --body "Direct REST patch runs: $DATA"
