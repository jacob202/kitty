name: PR Review Routing

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  route-review:
    runs-on: ubuntu-latest
    steps:
      - name: Route review by path scope
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const author = context.payload.pull_request.user.login;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100
            });
            const paths = files.map((f) => f.filename);

            const areas = new Set();
            for (const file of paths) {
              if (file.startsWith("gateway/kitty-chat/")) areas.add("frontend");
              else if (file.startsWith("gateway/") || file.startsWith("mcp/") || file.startsWith("tests/")) areas.add("backend");
              else if (file.startsWith(".github/")) areas.add("ci");
              else if (file.startsWith("scripts/") || file === "kitty" || file === "Makefile") areas.add("automation");
              else if (file.startsWith("docs/") || file === "README.md" || file === "AGENTS.md" || file === "START_HERE.md") areas.add("docs");
            }

            const reviewerMap = {
              backend: ["jacob202"],
              frontend: ["jacob202"],
              docs: ["jacob202"],
              ci: ["jacob202"],
              automation: ["jacob202"],
            };

            const requested = new Set();
            for (const area of areas) {
              for (const reviewer of reviewerMap[area] || []) {
                if (reviewer !== author) requested.add(reviewer);
              }
            }

            const reviewers = [...requested];
            if (reviewers.length > 0) {
              try {
                await github.rest.pulls.requestReviewers({
                  owner,
                  repo,
                  pull_number,
                  reviewers,
                });
                core.notice(`Requested reviewers: ${reviewers.join(", ")}`);
              } catch (error) {
                core.warning(`Could not request reviewers: ${error.message}`);
              }
            } else {
              core.notice("No eligible reviewers to request (author-only or unmapped scope).");
            }

            const marker = "<!-- review-routing -->";
            const areaList = [...areas];
            const body = [
              marker,
              "### Review routing",
              `- changed files: ${paths.length}`,
              `- inferred areas: ${areaList.length ? areaList.join(", ") : "none"}`,
              `- requested reviewers: ${reviewers.length ? reviewers.join(", ") : "(none)"}`,
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pull_number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.user?.type === "Bot" && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body,
              });
            }

