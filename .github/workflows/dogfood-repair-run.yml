name: Run dogfood recovery

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  run:
    if: github.head_ref == 'fix/dogfood-provider-chat-shell-2026-07-28'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dogfood-provider-chat-shell-2026-07-28
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gateway/kitty-chat/package-lock.json
      - name: Extract and apply repair
        run: |
          set +e
          python - <<'PY' > repair.log 2>&1
          from pathlib import Path

          lines = Path('.github/workflows/dogfood-repair-apply.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          extracted = []
          for line in lines[start:end]:
              if line.startswith('          '):
                  extracted.append(line[10:])
              else:
                  extracted.append(line.lstrip())
          Path('/tmp/apply_dogfood_repair.py').write_text('\n'.join(extracted) + '\n')
          compile(Path('/tmp/apply_dogfood_repair.py').read_text(), '/tmp/apply_dogfood_repair.py', 'exec')
          PY
          status=$?
          if [ $status -eq 0 ]; then
            python /tmp/apply_dogfood_repair.py >> repair.log 2>&1
            status=$?
          fi
          tail -n 200 repair.log
          exit $status
      - name: Validate Python repairs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          ruff check gateway/ tests/ mcp/
          mypy gateway/ mcp/
          pytest -q tests/test_provider_prefs.py tests/test_active_provider_routing.py tests/test_llm_client.py tests/test_chat_completions.py
      - name: Validate frontend repairs
        working-directory: gateway/kitty-chat
        run: |
          npm ci
          npm test -- --run
          npm run build
      - name: Upload repair diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dogfood-repair-log
          path: repair.log
          retention-days: 1
      - name: Commit repaired product seams
        run: |
          rm .github/workflows/dogfood-repair-apply.yml
          rm .github/workflows/dogfood-repair-run.yml
          git config user.name 'Kitty repair worker'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make provider choice real and consolidate work [dogfood-repair]'
          git push origin HEAD:fix/dogfood-provider-chat-shell-2026-07-28
