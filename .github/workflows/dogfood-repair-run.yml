name: Run dogfood recovery

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  run:
    if: github.head_ref == 'fix/dogfood-provider-chat-shell-2026-07-28'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dogfood-provider-chat-shell-2026-07-28
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gateway/kitty-chat/package-lock.json
      - name: Execute repair and validation scripts
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml

          source = Path('.github/workflows/dogfood-repair-apply.yml')
          workflow = yaml.safe_load(source.read_text())
          steps = workflow['jobs']['apply']['steps']
          wanted = [
              'Apply focused repairs',
              'Validate Python repairs',
              'Validate frontend repairs',
          ]
          for name in wanted:
              step = next(item for item in steps if item.get('name') == name)
              cwd = step.get('working-directory', '.')
              print(f'::group::{name}')
              subprocess.run(['bash', '-lc', step['run']], cwd=cwd, check=True)
              print('::endgroup::')
          PY
      - name: Commit repaired product seams
        run: |
          rm .github/workflows/dogfood-repair-apply.yml
          rm .github/workflows/dogfood-repair-run.yml
          git config user.name 'Kitty repair worker'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make provider choice real and consolidate work [dogfood-repair]'
          git push origin HEAD:fix/dogfood-provider-chat-shell-2026-07-28
