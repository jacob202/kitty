name: Build Kitty Worker Image and Preflight

# Deterministic build: the base image comes from the committed record
# workers/comfy_worker/runpod-template-image.json, never from the RunPod API
# (the free template diagnostic discovered it once). The built image is
# pushed to GHCR by commit SHA, its digest is recorded into
# workers/comfy_worker/worker-image.json, and a no-GPU preflight proves the
# exact deployed artifact binds 8000 and reports a structured state.
#
# The digest-record commit uses the fixed prefix below (chore(runpod): record worker image digest); the build short-
# circuits on it so the workflow does not loop on its own bookkeeping.
on:
  workflow_dispatch:
  push:
    branches:
      - feat/runpod-immutable-worker

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image_ref: ${{ steps.ref.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Short-circuit on the digest-record commit itself
        if: "startsWith(github.event.head_commit.message, 'chore(runpod): record worker image digest')"
        run: |
          echo "bookkeeping commit; nothing to build"
          exit 0

      - name: Resolve pinned base image
        id: base
        run: |
          python - <<'PY'
          import json
          record = json.load(open("workers/comfy_worker/runpod-template-image.json"))
          image = record["image_name"]
          with open("image-name.txt", "w", encoding="utf-8") as handle:
              handle.write(image + "\n")
          PY
          echo "image=$(cat image-name.txt)" >> "$GITHUB_OUTPUT"

      - name: Emit ref (SHA tags + digest reference)
        id: ref
        run: |
          echo "image_ref=ghcr.io/jacob202/kitty/comfy-worker:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by commit SHA
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/comfy_worker/Dockerfile
          build-args: |
            COMFYUI_BASE_IMAGE=${{ steps.base.outputs.image }}
          push: true
          tags: |
            ghcr.io/jacob202/kitty/comfy-worker:${{ github.sha }}
          labels: |
            com.kitty.source-repo=${{ github.repository }}
            com.kitty.source-ref=${{ github.sha }}

      - name: Record immutable digest
        run: |
          cat > workers/comfy_worker/worker-image.json <<JSON
          {
            "image_ref": "ghcr.io/jacob202/kitty/comfy-worker:${{ github.sha }}",
            "digest": "${{ steps.push.outputs.digest }}",
            "built_at": "${{ github.event.head_commit.timestamp }}",
            "build_run": "${{ github.run_id }}"
          }
          JSON
          git add workers/comfy_worker/worker-image.json
          if ! git diff --cached --quiet; then
            git -c user.name="jacob202" -c user.email="jacob@kitty.local" \
              commit -m "chore(runpod): record worker image digest ${{ steps.push.outputs.digest }}"
            git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi

  preflight:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preflight the exact image (no GPU)
        run: |
          DIGEST="$(python3 -c "import json; print(json.load(open('workers/comfy_worker/worker-image.json'))['digest'])")"
          python scripts/runpod_image_preflight.py \
            "ghcr.io/jacob202/kitty/comfy-worker@${DIGEST}"
