name: PR Release Evidence

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  publish-evidence:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Post CI evidence summary to linked PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            const marker = "<!-- release-evidence -->";

            if (!run.pull_requests || run.pull_requests.length === 0) {
              core.notice("No PR linked to this workflow run.");
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: run.id,
              per_page: 100,
            });
            const jobSummary = jobs
              .map((job) => `- ${job.name}: ${job.conclusion || job.status}`)
              .join("\n");

            const body = [
              marker,
              "### CI evidence snapshot",
              `- workflow: ${run.name}`,
              `- run: [#${run.run_number}](${run.html_url})`,
              `- conclusion: ${run.conclusion || run.status}`,
              `- head sha: \`${run.head_sha}\``,
              "",
              "#### Check runs",
              jobSummary || "- no jobs reported",
            ].join("\n");

            for (const pr of run.pull_requests) {
              const issue_number = pr.number;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              const existing = comments.find((c) => c.user?.type === "Bot" && c.body?.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body,
                });
              }
            }

