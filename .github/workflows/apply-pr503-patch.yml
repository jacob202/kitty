name: Apply audited PR 503 patch

on:
  push:
    branches: [fix/publication-infra-budget]
    paths: [.github/workflows/apply-pr503-patch.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/publication-infra-budget
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover tested patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          req = urllib.request.Request(
              'https://api.github.com/repos/jacob202/kitty/issues/comments/5303002710',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(req) as r:
              body = json.load(r)['body']
          marker = '```diff\n'
          start = body.index(marker) + len(marker)
          end = body.index('\n```', start)
          Path('/tmp/pr503.patch').write_text(body[start:end] + '\n', encoding='utf-8')
          PY
          git apply --check /tmp/pr503.patch
          git apply /tmp/pr503.patch

      - name: Apply audited source corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one audited replacement; found {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Reuse builder_runner's already-verified repo-root preflight receipt.
          replace_once(
              'gateway/builder_loop.py',
              '            preflight_worktree(task_id, repo_root=repo_root)\n',
              '            worktree_preflight = preflight_worktree(task_id, repo_root=repo_root)\n',
          )
          replace_once(
              'gateway/builder_loop.py',
              '''        if publication_preflight:\n            publication_probe = bj.publication_preflight(\n                Path(repo_root) if repo_root is not None else Path.cwd()\n            )\n            if publication_probe.returncode == PROVIDER_EXHAUSTED_EXIT_CODE:\n                detail = (\n                    publication_probe.stderr or publication_probe.stdout or ""\n                ).strip()\n''',
              '''        if publication_preflight:\n            publication_root = Path(worktree_preflight["repo_root"])\n            publication_probe = bj.publication_preflight(publication_root)\n            detail = (publication_probe.stderr or publication_probe.stdout or "").strip()\n            if (\n                publication_probe.returncode != 0\n                and publication_probe.returncode != PROVIDER_EXHAUSTED_EXIT_CODE\n            ):\n                suffix = f": {detail}" if detail else ""\n                raise LoopError(\n                    "publication environment preflight failed unexpectedly "\n                    f"(exit {publication_probe.returncode}){suffix}"\n                )\n            if publication_probe.returncode == PROVIDER_EXHAUSTED_EXIT_CODE:\n''',
          )

          # Name the Janitor helper for what it actually receives: an existing repo root.
          replace_once(
              'gateway/builder_pr_janitor.py',
              '''PUBLICATION_GATE_COMMAND = "./scripts/hooks/pre-push"\nPUBLICATION_PREFLIGHT_COMMAND = f"{PUBLICATION_GATE_COMMAND} --preflight"\n''',
              '''PUBLICATION_GATE_COMMAND = "./scripts/hooks/pre-push"\n''',
          )
          replace_once(
              'gateway/builder_pr_janitor.py',
              '''def publication_preflight(\n    worktree: Path, *, run_cmd: RunCmd | None = None\n) -> subprocess.CompletedProcess[str]:\n    """Probe publication prerequisites without running the full quality gate."""\n    runner = run_cmd or _default_run\n    return runner(\n        [PUBLICATION_GATE_COMMAND, "--preflight"], cwd=Path(worktree), check=False\n    )\n''',
              '''def publication_preflight(\n    repo_root: Path, *, run_cmd: RunCmd | None = None\n) -> subprocess.CompletedProcess[str]:\n    """Probe machine/toolchain prerequisites from an existing repository root."""\n    runner = run_cmd or _default_run\n    return runner(\n        [PUBLICATION_GATE_COMMAND, "--preflight"], cwd=Path(repo_root), check=False\n    )\n''',
          )

          # Preserve a durable initiative decision receipt for the transient stop.
          replace_once(
              'gateway/builder_run.py',
              '''        elif loop_result["outcome"] == bl.LOOP_INFRASTRUCTURE_BLOCKED:\n            processed.append(\n                {\n                    "packet_id": packet_id,\n                    "task_id": task_id,\n                    "outcome": loop_result["outcome"],\n                }\n            )\n            return {\n''',
              '''        elif loop_result["outcome"] == bl.LOOP_INFRASTRUCTURE_BLOCKED:\n            processed.append(\n                {\n                    "packet_id": packet_id,\n                    "task_id": task_id,\n                    "outcome": loop_result["outcome"],\n                }\n            )\n            _decide(\n                task_id,\n                {\n                    "initiative_id": initiative_id,\n                    "packet_id": packet_id,\n                    "decision": "infrastructure_blocked",\n                    "reason": loop_result.get("reason"),\n                    "stop_class": STOP_ROUTINE,\n                },\n                db_path,\n            )\n            return {\n''',
          )

          # Preserve infrastructure-class exits through the full aggregate gate.
          replace_once(
              'scripts/hooks/pre-push',
              '''FAILED=()\nrun_gate() {\n  local label="$1"; shift\n  say "${DIM}→ ${label}${OFF}"\n  if "$@" >/tmp/kitty-pre-push.$$ 2>&1; then\n    say "  ${GREEN}ok${OFF}  ${label}"\n  else\n    say "  ${RED}FAILED${OFF}  ${label}"\n    tail -n 25 /tmp/kitty-pre-push.$$ >&2\n    FAILED+=("${label}")\n  fi\n  rm -f /tmp/kitty-pre-push.$$\n}\n''',
              '''FAILED=()\nINFRA_FAILED=0\nrun_gate() {\n  local label="$1"; shift\n  local gate_rc=0\n  say "${DIM}→ ${label}${OFF}"\n  "$@" >/tmp/kitty-pre-push.$$ 2>&1 || gate_rc=$?\n  if [[ ${gate_rc} -eq 0 ]]; then\n    say "  ${GREEN}ok${OFF}  ${label}"\n  else\n    say "  ${RED}FAILED${OFF}  ${label}"\n    tail -n 25 /tmp/kitty-pre-push.$$ >&2\n    FAILED+=("${label}")\n    if [[ ${gate_rc} -eq 75 || ${gate_rc} -eq 126 || ${gate_rc} -eq 127 ]]; then\n      INFRA_FAILED=1\n    fi\n  fi\n  rm -f /tmp/kitty-pre-push.$$\n}\n''',
          )
          replace_once(
              'scripts/hooks/pre-push',
              '''say "${RED}Push blocked.${OFF} ${#FAILED[@]} of these failed: ${FAILED[*]}"\nsay ""\nsay "Nothing was sent. Fix the failure above, or run ${YELLOW}make ci${OFF} to see it in full."\n''',
              '''if [[ "${INFRA_FAILED}" == "1" ]]; then\n  say "${RED}Push blocked by publication infrastructure.${OFF} ${#FAILED[@]} gate(s) could not run reliably: ${FAILED[*]}"\n  say ""\n  exit 75\nfi\n\nsay "${RED}Push blocked.${OFF} ${#FAILED[@]} of these failed: ${FAILED[*]}"\nsay ""\nsay "Nothing was sent. Fix the failure above, or run ${YELLOW}make ci${OFF} to see it in full."\n''',
          )

          # Pin the corrected boundaries in focused regressions.
          p = Path('tests/test_builder_publication_infrastructure.py')
          text = p.read_text(encoding='utf-8')
          marker = '    _stub_janitor(monkeypatch)\n\n    result = bl.run_packet(\n'
          capture = '''    _stub_janitor(monkeypatch)\n    seen_preflight_paths: list[Path] = []\n    real_preflight = bl.bj.publication_preflight\n\n    def capture_preflight(repo_root: Path, **kwargs):\n        seen_preflight_paths.append(Path(repo_root))\n        return real_preflight(repo_root, **kwargs)\n\n    monkeypatch.setattr(bl.bj, "publication_preflight", capture_preflight)\n\n    result = bl.run_packet(\n'''
          if text.count(marker) != 2:
              raise SystemExit(f'publication test marker mismatch: {text.count(marker)}')
          text = text.replace(marker, capture, 1)
          needle = '    assert not marker.exists(), "worker must not run when publication environment is unavailable"\n'
          text = text.replace(needle, needle + '    assert seen_preflight_paths == [repo]\n', 1)
          text += '''\n\ndef test_unexpected_publication_preflight_exit_fails_before_attempt(\n    repo: Path, db_path: Path, tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    _install_gate(\n        repo,\n        'if [[ "${1:-}" == "--preflight" ]]; then echo "bad preflight contract" >&2; exit 1; fi\\nexit 0\\n',\n    )\n    task_id = _apply(db_path, repo)\n    marker = tmp_path / "worker-ran-unexpected"\n    _stub_janitor(monkeypatch)\n\n    with pytest.raises(bl.LoopError, match="publication environment preflight failed unexpectedly"):\n        bl.run_packet(\n            INITIATIVE, PACKET, worker_command=_worker(tmp_path, marker),\n            repo_root=repo, db_path=db_path, publication_preflight=True,\n        )\n\n    assert ba.list_attempts(INITIATIVE, PACKET, db_path=db_path) == []\n    assert not marker.exists()\n    assert bq.get_task(task_id, db_path=db_path)["state"] == bq.QUEUED\n'''
          p.write_text(text, encoding='utf-8')

          replace_once(
              'tests/test_builder_run.py',
              '''        assert summary["outcome"] == br.bl.LOOP_INFRASTRUCTURE_BLOCKED\n        assert summary["exhausted"] == 0\n        assert bi.get_initiative_state(INITIATIVE, db_path=db_path) != bi.INITIATIVE_PAUSED\n''',
              '''        assert summary["outcome"] == br.bl.LOOP_INFRASTRUCTURE_BLOCKED\n        assert summary["exhausted"] == 0\n        assert bi.get_initiative_state(INITIATIVE, db_path=db_path) != bi.INITIATIVE_PAUSED\n        decisions = [\n            event for event in bq.list_events(summary["task_id"], db_path=db_path)\n            if event["type"] == br.EVENT_DECISION\n        ]\n        assert decisions[-1]["payload"]["decision"] == "infrastructure_blocked"\n''',
          )

          p = Path('tests/test_pre_push_gate.py')
          p.write_text(p.read_text(encoding='utf-8') + '''\n\ndef test_full_gate_preserves_infrastructure_exit_class(hook_text):\n    assert "INFRA_FAILED=0" in hook_text\n    assert "gate_rc} -eq 75" in hook_text\n    assert "gate_rc} -eq 126" in hook_text\n    assert "gate_rc} -eq 127" in hook_text\n    assert 'if [[ "${INFRA_FAILED}" == "1" ]]' in hook_text\n    assert "exit 75" in hook_text\n''', encoding='utf-8')
          PY

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff mypy types-requests types-PyYAML types-python-dateutil

      - name: Verify audited patch
        run: |
          python -m pytest \
            tests/test_builder_publication_infrastructure.py \
            tests/test_builder_loop.py::TestRunPacket::test_publication_gate_failure_is_repair_input_for_next_worker \
            tests/test_builder_run.py::TestRunInitiative::test_infrastructure_blocked_stops_without_pausing_or_exhausting \
            tests/test_pre_push_gate.py::test_preflight_checks_environment_without_running_quality_gates \
            tests/test_pre_push_gate.py::test_full_gate_preserves_infrastructure_exit_class \
            -q --tb=short
          python -m ruff check gateway/builder_loop.py gateway/builder_pr_janitor.py gateway/builder_run.py \
            tests/test_builder_publication_infrastructure.py tests/test_builder_run.py tests/test_pre_push_gate.py
          python -m mypy gateway/builder_loop.py gateway/builder_pr_janitor.py gateway/builder_run.py
          bash -n scripts/hooks/pre-push
          ./scripts/hooks/pre-push --preflight
          git diff --check

      - name: Publish implementation and remove transport workflow
        run: |
          git rm .github/workflows/apply-pr503-patch.yml
          git add gateway/builder_loop.py gateway/builder_pr_janitor.py gateway/builder_run.py \
            scripts/hooks/pre-push tests/test_builder_publication_infrastructure.py \
            tests/test_builder_run.py tests/test_pre_push_gate.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(builder): keep publication outages budget neutral'
          git push origin HEAD:fix/publication-infra-budget
