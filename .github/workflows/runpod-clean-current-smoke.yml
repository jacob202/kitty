name: Clean Current RunPod Smoke

on:
  push:
    branches: [feat/runpod-image-studio-smoke]
    paths:
      - .github/runpod-clean-current-smoke.trigger

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runpod-image-studio-smoke
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install httpx==0.28.1

      - name: Terminate active smoke resources
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import httpx

          base = "https://rest.runpod.io/v1"
          headers = {
              "Authorization": f"Bearer {os.environ['RUNPOD_API_KEY']}",
              "Content-Type": "application/json",
          }
          deleted_pods = []
          deleted_templates = []
          with httpx.Client(timeout=45) as client:
              pods = client.get(f"{base}/pods", headers=headers)
              pods.raise_for_status()
              for pod in pods.json():
                  name = str(pod.get("name") or "")
                  if not name.startswith("kitty-image-james-"):
                      continue
                  pod_id = str(pod.get("id") or "")
                  if not pod_id:
                      continue
                  response = client.delete(f"{base}/pods/{pod_id}", headers=headers)
                  if response.status_code not in {204, 404}:
                      response.raise_for_status()
                  deleted_pods.append(pod_id)

              templates = client.get(
                  f"{base}/templates",
                  headers=headers,
                  params={"includePublicTemplates": False, "includeRunpodTemplates": False},
              )
              templates.raise_for_status()
              values = templates.json()
              if isinstance(values, dict):
                  values = values.get("templates") or values.get("data") or []
              for template in values if isinstance(values, list) else []:
                  name = str(template.get("name") or "")
                  if not name.startswith("kitty-james-live-"):
                      continue
                  template_id = str(template.get("id") or "")
                  if not template_id:
                      continue
                  response = client.delete(
                      f"{base}/templates/{template_id}", headers=headers
                  )
                  if response.status_code not in {204, 404}:
                      response.raise_for_status()
                  deleted_templates.append(template_id)

              remaining = client.get(f"{base}/pods", headers=headers)
              remaining.raise_for_status()
              remaining_smoke = [
                  {"id": pod.get("id"), "name": pod.get("name")}
                  for pod in remaining.json()
                  if str(pod.get("name") or "").startswith("kitty-image-james-")
              ]
          print("DELETED_PODS=" + json.dumps(deleted_pods))
          print("DELETED_TEMPLATES=" + json.dumps(deleted_templates))
          print("REMAINING_SMOKE_PODS=" + json.dumps(remaining_smoke))
          if remaining_smoke:
              raise SystemExit("smoke Pods remain after cleanup")
          PY

      - name: Remove temporary diagnostics
        shell: bash
        run: |
          rm -f \
            .github/runpod-clean-current-smoke.trigger \
            .github/runpod-live-probe.trigger \
            .github/runpod-reset-active-smoke.trigger \
            .github/workflows/runpod-clean-current-smoke.yml \
            .github/workflows/runpod-live-probe.yml \
            .github/workflows/runpod-reset-active-smoke.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore(image): remove temporary RunPod diagnostics"
          git push origin HEAD:feat/runpod-image-studio-smoke
