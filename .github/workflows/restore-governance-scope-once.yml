name: Restore governance scope once

on:
  push:
    branches:
      - claude/alignment-map-packet-audit-xbsbbi

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/alignment-map-packet-audit-xbsbbi
          fetch-depth: 0
      - name: Restore runtime and unit fixture from current main
        run: |
          git fetch origin main
          git show origin/main:gateway/context_receipt.py > gateway/context_receipt.py
          git show origin/main:tests/test_context_receipt.py > tests/test_context_receipt.py
      - name: Commit restoration and remove workflow
        run: |
          rm .github/workflows/restore-governance-scope-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gateway/context_receipt.py tests/test_context_receipt.py .github/workflows/restore-governance-scope-once.yml
          git commit -m "chore(governance): keep runtime enforcement for a bounded packet"
          git push origin HEAD:claude/alignment-map-packet-audit-xbsbbi
