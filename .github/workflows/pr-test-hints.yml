name: PR Test Hints

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  suggest-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Post scoped test hints
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const marker = "<!-- test-hints -->";

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100
            });
            const changed = files.map((f) => f.filename);

            const hints = [];
            const pythonTests = changed.filter((path) => path.startsWith("tests/") && path.endsWith(".py"));
            const backendChanged = changed.some((path) => path.startsWith("gateway/") || path.startsWith("mcp/"));
            const frontendChanged = changed.some((path) => path.startsWith("gateway/kitty-chat/"));
            const llmRoutingTouched = changed.some((path) =>
              ["gateway/routes/completions.py", "gateway/llm_client.py"].includes(path)
            );
            const ciChanged = changed.some((path) => path.startsWith(".github/workflows/"));

            if (pythonTests.length > 0) {
              hints.push(`python3.12 -m pytest ${pythonTests.join(" ")} -q --tb=short`);
            } else if (backendChanged) {
              hints.push("python3.12 -m pytest tests/ -q --tb=short");
            }

            if (llmRoutingTouched) {
              hints.push("python3.12 -m pytest tests/test_chat_completions.py tests/test_llm_client.py -q");
            }

            if (frontendChanged) {
              hints.push("cd gateway/kitty-chat && npm test");
              hints.push("cd gateway/kitty-chat && npm run build");
            }

            if (ciChanged) {
              hints.push("Review workflow syntax and permissions for all changed .github/workflows files.");
            }

            const uniqueHints = [...new Set(hints)];
            const body = [
              marker,
              "### Suggested validation commands",
              `- changed files: ${changed.length}`,
              ...(uniqueHints.length ? uniqueHints.map((hint) => `- \`${hint}\``) : ["- No scoped hint matched; validate manually."]),
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pull_number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.user?.type === "Bot" && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body,
              });
            }

