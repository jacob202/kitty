              '        return {"order": [], "disabled": [], "active": "auto"}',
          )
          replace_once(
              'gateway/provider_prefs.py',
              '        return {"order": [], "disabled": []}',
              '        return {"order": [], "disabled": [], "active": "auto"}',
          )
