name: Apply dogfood recovery

on:
  push:
    branches:
      - fix/dogfood-provider-chat-shell-2026-07-28

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[dogfood-repair]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dogfood-provider-chat-shell-2026-07-28
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gateway/kitty-chat/package-lock.json
      - name: Apply focused repairs
        run: |
          python - <<'PY'
          from pathlib import Path

