name: Fix Direct REST Patch Runner

on:
  push:
    branches: [feat/runpod-image-studio-smoke]
    paths:
      - .github/fix-direct-rest-patch-runner.trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runpod-image-studio-smoke
          fetch-depth: 0

      - name: Fix test path and retrigger patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/runpod-apply-direct-rest-fix.yml')
          text = path.read_text(encoding='utf-8')
          old = 'python -m pytest tests/test_runpod_control.py tests/test_runpod_worker.py -q'
          new = 'python -m pytest tests/test_runpod_control.py -q'
          if text.count(old) != 1:
              raise SystemExit(f'expected one test command, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/runpod-direct-rest-fix.trigger').write_text('retry\n', encoding='utf-8')
          PY
          rm .github/workflows/fix-direct-rest-patch-runner.yml .github/fix-direct-rest-patch-runner.trigger
          rm -f .github/direct-rest-patch-report.txt .github/workflows/capture-direct-rest-patch.yml .github/capture-direct-rest-patch.trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ci(image): fix direct REST patch verification"
          git push origin HEAD:feat/runpod-image-studio-smoke
