area/backend:
  - changed-files:
      - any-glob-to-any-file:
          - "gateway/**/*.py"
          - "mcp/**/*.py"
          - "tests/**/*.py"
          - "requirements*.txt"
          - "pyproject.toml"

area/frontend:
  - changed-files:
      - any-glob-to-any-file:
          - "gateway/kitty-chat/**/*"

area/docs:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**/*"
          - "README.md"
          - "AGENTS.md"
          - "START_HERE.md"

area/ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**/*"

area/automation:
  - changed-files:
      - any-glob-to-any-file:
          - "scripts/**/*"
          - "kitty"
          - "Makefile"
